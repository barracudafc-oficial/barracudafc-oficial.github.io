 265 223" role="img" aria-label="Jugador con uniforme morado de Barracuda F.C. bebiendo agua" preserveAspectRatio="xMidYMid slice"><image href="assets/Barracuda_Hidratacion_Diseno.png" x="0" y="0" width="1024" height="1536"/></svg><div><h2 data-i="12"></h2><p data-i="13"></p></div></section><section class="section"><h2 data-i="14"></h2><div class="tips"><div class="tip drink"><h3>💧</h3><p data-i="15"></p></div><div class="tip drink"><h3>🏃</h3><p data-i="16"></p></div><div class="tip drink"><h3>⚠️</h3><p data-i="17"></p></div></div></section><section class="section split"><div class="warning"><h2 data-i="18"></h2><p data-i="19"></p></div><svg class="photo" viewBox="175 1164 172 211" role="img" aria-label="Futbolista con uniforme de Barracuda F.C. descansando" preserveAspectRatio="xMidYMid slice"><image href="assets/Barracuda_Hidratacion_Diseno.png" x="0" y="0" width="1024" height="1536"/></svg></section><section class="section split reverse"><svg class="photo" viewBox="648 903 373 251" role="img" aria-label="Jugadores de Barracuda F.C. descansando e hidratándose durante el entrenamiento" preserveAspectRatio="xMidYMid slice"><image href="assets/Barracuda_Hidratacion_Diseno.png" x="0" y="0" width="1024" height="1536"/></svg><div><h2 data-i="20"></h2><p data-i="21"></p></div></section><section class="section commit"><h2 data-i="22"></h2><p data-i="23"></p></section><p class="note" data-i="24"></p><div class="actions"><a href="https://barracudafc.com/noticias.html" data-i="26"></a><button type="button" id="share" data-i="25"></button></div></article></main><footer class="footer"><strong>BARRACUDA F.C.</strong><div class="motto">DISCIPLINA · UNIÓN · GRANDEZA</div><div>www.barracudafc.com</div></footer></div><script>const translations={"es":["SALUD Y DEPORTE","La hidratación en el deporte","El agua también juega en nuestro equipo.","Una hidratación adecuada ayuda a regular la temperatura corporal, mantener la concentración y sostener el rendimiento. Durante el ejercicio perdemos agua y minerales a través del sudor.","¿Por qué es importante?","El agua contribuye a la circulación, al transporte de nutrientes y al funcionamiento muscular. La falta de líquidos puede provocar fatiga, mareos y menor capacidad de atención.","Antes de entrenar","Empieza bien hidratado. Bebe agua de forma habitual durante el día y lleva tu botella al entrenamiento.","Durante la actividad","Aprovecha las pausas para beber agua en cantidades pequeñas y frecuentes. Ajusta la hidratación al calor, la intensidad, la duración y el sudor.","Después del ejercicio","Repón los líquidos perdidos y acompaña la recuperación con alimentos saludables. Si has sudado mucho, también puede ser necesario reponer sodio.","Agua y sales minerales","El sudor contiene principalmente agua y sodio, además de pequeñas cantidades de otros minerales. Las bebidas con electrolitos pueden ser útiles en sesiones prolongadas o intensas, según las necesidades individuales.","¿Qué debemos beber?","Agua: primera opción para la mayoría de los entrenamientos.","Bebidas deportivas: pueden ayudar en esfuerzos largos, intensos o con mucho calor.","Bebidas energéticas: no son apropiadas para hidratarse y no se recomiendan para niños ni adolescentes.","Señales de deshidratación","Sed intensa, boca seca, dolor de cabeza, mareos, debilidad y orina muy oscura son señales de alerta. Confusión, desmayo o síntomas graves por calor requieren atención médica urgente.","El clima de Santa Elena","Con calor y humedad es importante programar descansos, buscar sombra y adaptar la intensidad del entrenamiento. Entrenadores y familias deben facilitar agua a los deportistas.","Nuestro compromiso","Barracuda F.C. promueve hábitos saludables, prevención y formación integral. Cuidar la hidratación es cuidar a nuestros deportistas.","Este artículo ofrece información general y no sustituye la valoración de un profesional de la salud.","Compartir","Volver a la revista","Idioma"],"en":["HEALTH AND SPORT","Hydration in sport","Water plays on our team too.","Good hydration helps regulate body temperature, maintain concentration and support performance. During exercise, we lose water and minerals through sweat.","Why is hydration important?","Water supports circulation, nutrient transport and muscle function. Not drinking enough may cause fatigue, dizziness and reduced concentration.","Before training","Start well hydrated. Drink water regularly throughout the day and bring a bottle to training.","During activity","Use breaks to drink small amounts of water regularly. Adjust your intake to the heat, intensity, duration and sweating.","After exercise","Replace lost fluids and support recovery with healthy food. Heavy sweating may also require replacing sodium.","Water and electrolytes","Sweat contains mainly water and sodium, plus smaller amounts of other minerals. Electrolyte drinks may help during long or intense sessions depending on individual needs.","What should we drink?","Water: the first choice for most training sessions.","Sports drinks: may help during long, intense exercise or in high heat.","Energy drinks: unsuitable for hydration and not recommended for children or teenagers.","Signs of dehydration","Strong thirst, dry mouth, headache, dizziness, weakness and very dark urine are warning signs. Confusion, fainting or severe heat symptoms require urgent medical care.","Santa Elena's climate","In hot and humid conditions, schedule breaks, seek shade and adjust training intensity. Coaches and families should make water available to athletes.","Our commitment","Barracuda F.C. promotes healthy habits, prevention and personal development. Supporting hydration means caring for our athletes.","This article provides general information and does not replace professional medical advice.","Share","Back to the magazine","Language"],"pt":["SAÚDE E ESPORTE","A hidratação no esporte","A água também joga em nossa equipe.","Uma boa hidratação ajuda a regular a temperatura corporal, manter a concentração e sustentar o desempenho. Durante o exercício, perdemos água e minerais pelo suor.","Por que a hidratação é importante?","A água ajuda na circulação, no transporte de nutrientes e no funcionamento muscular. A falta de líquidos pode causar fadiga, tontura e menor concentração.","Antes do treino","Comece bem hidratado. Beba água regularmente ao longo do dia e leve sua garrafa ao treino.","Durante a atividade","Aproveite as pausas para beber pequenas quantidades de água regularmente. Ajuste a ingestão ao calor, à intensidade, à duração e ao suor.","Depois do exercício","Reponha os líquidos perdidos e ajude a recuperação com alimentos saudáveis. A transpiração intensa também pode exigir reposição de sódio.","Água e eletrólitos","O suor contém principalmente água e sódio, além de pequenas quantidades de outros minerais. Bebidas com eletrólitos podem ajudar em sessões longas ou intensas, conforme as necessidades individuais.","O que devemos beber?","Água: primeira opção para a maioria dos treinos.","Bebidas esportivas: podem ajudar em esforços longos, intensos ou sob muito calor.","Bebidas energéticas: inadequadas para hidratação e não recomendadas para crianças ou adolescentes.","Sinais de desidratação","Sede intensa, boca seca, dor de cabeça, tontura, fraqueza e urina muito escura são sinais de alerta. Confusão, desmaio ou sintomas graves de calor exigem atendimento médico urgente.","O clima de Santa Elena","Com calor e umidade, programe pausas, procure sombra e adapte a intensidade. Treinadores e famílias devem garantir água aos atletas.","Nosso compromisso","O Barracuda F.C. promove hábitos saudáveis, prevenção e formação integral. Cuidar da hidratação é cuidar dos atletas.","Este artigo oferece informações gerais e não substitui a avaliação de um profissional de saúde.","Compartilhar","Voltar à revista","Idioma"],"fr":["SANTÉ ET SPORT","L’hydratation dans le sport","L’eau joue aussi dans notre équipe.","Une bonne hydratation aide à réguler la température du corps, à rester concentré et à soutenir les performances. Pendant l’exercice, nous perdons de l’eau et des minéraux par la transpiration.","Pourquoi l’hydratation est-elle importante ?","L’eau favorise la circulation, le transport des nutriments et le fonctionnement musculaire. Le manque de liquides peut entraîner fatigue, vertiges et baisse de concentration.","Avant l’entraînement","Commencez bien hydraté. Buvez régulièrement de l’eau dans la journée et apportez une gourde à l’entraînement.","Pendant l’activité","Profitez des pauses pour boire régulièrement de petites quantités d’eau. Adaptez l’apport à la chaleur, à l’intensité, à la durée et à la transpiration.","Après l’exercice","Remplacez les liquides perdus et favorisez la récupération avec une alimentation saine. Une forte transpiration peut aussi nécessiter un apport en sodium.","Eau et électrolytes","La sueur contient surtout de l’eau et du sodium, ainsi que de petites quantités d’autres minéraux. Les boissons électrolytiques peuvent être utiles lors d’efforts longs ou intenses selon les besoins.","Que faut-il boire ?","Eau : premier choix pour la plupart des entraînements.","Boissons pour sportifs : parfois utiles lors d’efforts longs, intenses ou par forte chaleur.","Boissons énergisantes : inadaptées à l’hydratation et déconseillées aux enfants et adolescents.","Signes de déshydratation","Soif intense, bouche sèche, maux de tête, vertiges, faiblesse et urines très foncées sont des signaux d’alerte. Confusion, évanouissement ou symptômes graves liés à la chaleur nécessitent des soins urgents.","Le climat de Santa Elena","Par temps chaud et humide, prévoyez des pauses, recherchez l’ombre et adaptez l’intensité. Entraîneurs et familles doivent fournir de l’eau aux sportifs.","Notre engagement","Barracuda F.C. encourage les habitudes saines, la prévention et le développement personnel. Veiller à l’hydratation, c’est prendre soin des sportifs.","Cet article fournit des informations générales et ne remplace pas un avis médical professionnel.","Partager","Retour au magazine","Langue"],"de":["GESUNDHEIT UND SPORT","Flüssigkeitszufuhr im Sport","Wasser gehört auch zu unserem Team.","Ausreichendes Trinken hilft, die Körpertemperatur zu regulieren, konzentriert zu bleiben und die Leistung zu unterstützen. Beim Sport verlieren wir durch Schwitzen Wasser und Mineralstoffe.","Warum ist Trinken wichtig?","Wasser unterstützt den Kreislauf, den Nährstofftransport und die Muskelfunktion. Flüssigkeitsmangel kann Müdigkeit, Schwindel und Konzentrationsprobleme verursachen.","Vor dem Training","Beginne gut hydriert. Trinke über den Tag verteilt regelmäßig Wasser und bringe eine Trinkflasche zum Training mit.","Während des Sports","Nutze Pausen, um regelmäßig kleine Mengen Wasser zu trinken. Passe die Trinkmenge an Hitze, Intensität, Dauer und Schweißverlust an.","Nach dem Sport","Ersetze verlorene Flüssigkeit und unterstütze die Erholung mit gesunder Ernährung. Bei starkem Schwitzen kann auch Natrium ersetzt werden müssen.","Wasser und Elektrolyte","Schweiß enthält vor allem Wasser und Natrium sowie kleinere Mengen anderer Mineralstoffe. Elektrolytgetränke können bei langen oder intensiven Einheiten je nach Bedarf sinnvoll sein.","Was sollten wir trinken?","Wasser: erste Wahl für die meisten Trainingseinheiten.","Sportgetränke: können bei langen, intensiven Belastungen oder großer Hitze helfen.","Energydrinks: ungeeignet zur Flüssigkeitszufuhr und für Kinder und Jugendliche nicht empfohlen.","Warnzeichen für Flüssigkeitsmangel","Starker Durst, trockener Mund, Kopfschmerzen, Schwindel, Schwäche und sehr dunkler Urin sind Warnzeichen. Verwirrtheit, Ohnmacht oder schwere Hitzesymptome erfordern sofortige medizinische Hilfe.","Das Klima von Santa Elena","Bei Hitze und hoher Luftfeuchtigkeit sind Pausen, Schatten und angepasste Trainingsintensität wichtig. Trainer und Familien sollten Wasser bereitstellen.","Unser Engagement","Barracuda F.C. fördert gesunde Gewohnheiten, Prävention und ganzheitliche Entwicklung. Gute Flüssigkeitsversorgung schützt unsere Sportler.","Dieser Artikel bietet allgemeine Informationen und ersetzt keine professionelle medizinische Beratung.","Teilen","Zurück zum Magazin","Sprache"],"it":["SALUTE E SPORT","L’idratazione nello sport","Anche l’acqua gioca nella nostra squadra.","Una buona idratazione aiuta a regolare la temperatura corporea, mantenere la concentrazione e sostenere le prestazioni. Durante l’attività fisica perdiamo acqua e minerali con il sudore.","Perché l’idratazione è importante?","L’acqua favorisce la circolazione, il trasporto dei nutrienti e la funzione muscolare. La carenza di liquidi può causare stanchezza, vertigini e difficoltà di concentrazione.","Prima dell’allenamento","Inizia ben idratato. Bevi acqua regolarmente durante la giornata e porta una borraccia all’allenamento.","Durante l’attività","Approfitta delle pause per bere spesso piccole quantità d’acqua. Adatta l’assunzione al caldo, all’intensità, alla durata e alla sudorazione.","Dopo l’esercizio","Reintegra i liquidi persi e favorisci il recupero con cibi sani. Se hai sudato molto, potrebbe essere necessario reintegrare anche il sodio.","Acqua ed elettroliti","Il sudore contiene soprattutto acqua e sodio, oltre a piccole quantità di altri minerali. Le bevande con elettroliti possono aiutare durante sessioni lunghe o intense secondo le necessità individuali.","Cosa dovremmo bere?","Acqua: prima scelta per la maggior parte degli allenamenti.","Bevande sportive: possono aiutare durante sforzi lunghi, intensi o con molto caldo.","Bevande energetiche: non adatte all’idratazione e sconsigliate a bambini e adolescenti.","Segnali di disidratazione","Sete intensa, bocca secca, mal di testa, vertigini, debolezza e urine molto scure sono segnali di allarme. Confusione, svenimento o gravi sintomi da calore richiedono assistenza medica urgente.","Il clima di Santa Elena","Con caldo e umidità, programma pause, cerca l’ombra e adatta l’intensità. Allenatori e famiglie devono garantire acqua agli atleti.","Il nostro impegno","Barracuda F.C. promuove abitudini sane, prevenzione e formazione integrale. Curare l’idratazione significa proteggere i nostri atleti.","Questo articolo fornisce informazioni generali e non sostituisce il parere di un professionista sanitario.","Condividi","Torna alla rivista","Lingua"]};const sel=document.getElementById('idioma');function apply(lang){if(!translations[lang])lang='es';const t=translations[lang];document.documentElement.lang=lang;document.title=t[1]+' | Barracuda F.C.';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[Number(el.dataset.i)]);document.getElementById('langlabel').textContent=t[27];sel.value=lang;try{localStorage.setItem('barracuda-lang',lang)}catch(e){}}sel.addEventListener('change',e=>apply(e.target.value));let lang=new URLSearchParams(location.search).get('lang');if(!lang){try{lang=localStorage.getItem('barracuda-lang')}catch(e){}}apply(lang||'es');document.getElementById('share').addEventListener('click',async()=>{const url=new URL(location.href);url.searchParams.set('lang',sel.value);if(navigator.share){try{await navigator.share({title:document.title,url:url.href})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(url.href);alert('Enlace copiado / Link copied')}});</script></body></html>
