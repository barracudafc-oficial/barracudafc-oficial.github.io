<script>
const articles = {"es": ["El fútbol también tiene nombre de mujer", "Talento, coraje y sueños sin límites", "Volver a la revista", "Volver al inicio", "<div class=\"intro\"><p><strong>El talento no tiene género, los sueños no conocen fronteras y las oportunidades deben estar al alcance de todas.<\/strong> Una mirada al presente y al futuro del fútbol femenino, desde las grandes competiciones hasta las canchas donde comienzan los sueños.<\/p><\/div><section class=\"article\"><h2>Una historia de lucha, pasión y perseverancia<\/h2><p>Durante generaciones, millones de niñas y mujeres encontraron obstáculos para practicar el deporte que amaban. Lo que para muchos niños era una actividad cotidiana, para ellas representaba, en ocasiones, un desafío frente a prejuicios sociales, limitaciones económicas y falta de oportunidades.<\/p><p>Sin embargo, el fútbol femenino nunca dejó de avanzar.<\/p><p>Cada niña que se atrevió a entrar en una cancha, cada familia que respaldó sus sueños y cada entrenadora que abrió un espacio para nuevas generaciones contribuyeron a transformar la historia de este deporte.<\/p><p>Hoy, el fútbol femenino es una expresión de talento, esfuerzo, liderazgo y superación.<\/p><\/section><section class=\"article\"><h2>El crecimiento del fútbol femenino en el mundo<\/h2><p>El crecimiento del fútbol femenino demuestra que el talento siempre estuvo presente. Lo que faltaba, en muchos lugares, eran las condiciones necesarias para desarrollarlo.<\/p><p>Las competiciones internacionales, las ligas profesionales, la mayor visibilidad mediática y la participación de instituciones deportivas han contribuido a ampliar las oportunidades para miles de futbolistas.<\/p><p>No obstante, todavía existen importantes desafíos: diferencias en infraestructura, acceso a entrenadores especializados, financiamiento, atención médica y continuidad de los procesos formativos.<\/p><p class=\"accent\">El verdadero progreso no consiste únicamente en llenar estadios, sino en garantizar que cada niña tenga la oportunidad de comenzar a jugar.<\/p><\/section><\/div><div class=\"feature\"><div class=\"wrap\"><h2>Las niñas no necesitan que les regalen oportunidades: necesitan que se las garanticen<\/h2><div class=\"values\"><div class=\"value\"><b>01 · Formación deportiva de calidad<\/b><p>Entrenamientos adecuados a cada etapa de desarrollo, acompañamiento técnico y acceso a competiciones.<\/p><\/div><div class=\"value\"><b>02 · Salud y bienestar<\/b><p>Prevención de lesiones, nutrición, descanso y apoyo psicológico para una formación integral.<\/p><\/div><div class=\"value\"><b>03 · Entornos seguros y respetuosos<\/b><p>Protección frente a la discriminación, el acoso y cualquier forma de violencia.<\/p><\/div><div class=\"value\"><b>04 · Educación y oportunidades<\/b><p>Compatibilizar la formación académica con el desarrollo deportivo y personal.<\/p><\/div><\/div><\/div><\/div><div class=\"wrap\"><section class=\"article\"><div class=\"feature-grid\"><div><h2>Barracuda F.C.: nuestro compromiso con el fútbol femenino<\/h2><p>Desde la provincia de Santa Elena, Ecuador, Barracuda F.C. trabaja para construir oportunidades de desarrollo deportivo y humano.<\/p><p>Nuestra institución reconoce que el fútbol femenino no debe considerarse una actividad complementaria, sino una parte fundamental de su proyecto deportivo.<\/p><p>Con categorías femeninas Sub-17, Sub-19 y mayores, buscamos fortalecer un proceso que permita a nuestras deportistas desarrollar sus capacidades, participar en competiciones y construir proyectos de vida dentro y fuera de las canchas.<\/p><p>Nuestro compromiso va más allá de los resultados deportivos. Aspiramos a formar mujeres seguras de sí mismas, responsables, solidarias y capaces de asumir nuevos desafíos.<\/p><\/div><\/div><\/section><section class=\"article\"><h2>El papel de las familias y la sociedad<\/h2><p>Detrás de muchas futbolistas existe una historia de sacrificio familiar.<\/p><p>Madres, padres y representantes que acompañan entrenamientos, organizan sus jornadas, afrontan gastos de transporte y alientan a sus hijas incluso cuando los resultados no son favorables.<\/p><p>Ese acompañamiento es fundamental.<\/p><p>Pero la responsabilidad no corresponde únicamente a las familias. Las instituciones educativas, los gobiernos, las empresas y las organizaciones deportivas también pueden contribuir a crear condiciones más equitativas.<\/p><p>Apoyar el fútbol femenino significa invertir en salud, educación, convivencia y desarrollo social.<\/p><\/section><section class=\"section\"><h2>Lo que aprende una jugadora desde su primer entrenamiento<\/h2><p>Una adolescente llega por primera vez al entrenamiento. Le cuesta controlar el balón y, cuando se equivoca en un pase, prefiere esconderse detrás de una compañera para que no vuelvan a jugar con ella. El cuerpo técnico puede corregir el gesto técnico y, al mismo tiempo, crear una situación para que vuelva a intentarlo. En un ejercicio de grupos pequeños, donde todas reciben el balón, esa jugadora tendrá más oportunidades de practicar y de ganar confianza.<\/p><p>Con el tiempo aprende a levantar la mirada antes de pasar, a ofrecerse como apoyo y a comunicar lo que ve en la cancha. También aprende a pedir ayuda, a reconocer un error y a escuchar una corrección sin sentirse menos que las demás. La formación se nota en esos detalles. Una jugadora que hoy se anima a pedir el balón puede ser mañana quien ayude a integrar a una compañera nueva.<\/p><\/section><section class=\"section\"><h2>Que empezar a jugar también signifique poder quedarse<\/h2><p>Abrir una categoría femenina es un primer paso. Sostenerla exige que las jugadoras puedan asistir semana tras semana. Pensemos en una estudiante cuyo entrenamiento empieza poco después de salir de clases. Si desconoce los horarios de la semana siguiente o no cuenta con transporte de regreso, participar depende de que su familia pueda improvisar cada vez. Algo parecido ocurre cuando un partido coincide con un examen o cuando los costos de competir se conocen a última hora.<\/p><p>Para los clubes, avisar con anticipación, explicar los costos y escuchar a las jugadoras cuando empiezan a faltar son medidas al alcance de una institución formativa. También importa revisar cómo se reparten los horarios de cancha, quién acompaña a cada categoría y cuántos partidos puede disputar durante el año. Una jugadora necesita una rutina de entrenamiento y ocasiones para poner en práctica lo aprendido. Ambas cosas forman parte de la oportunidad de jugar.<\/p><p>Las familias también pueden ayudar a sostener esa continuidad. Una conversación al comienzo de la semana permite organizar los estudios, el descanso y los traslados. Al volver de un partido, preguntas como «¿Qué aprendiste hoy?» o «¿En qué te gustaría mejorar?» dan espacio para hablar de lo ocurrido. A veces la respuesta será un pase bien dado. Otras veces será una dificultad que la jugadora necesita conversar con su entrenadora. Escucharla es una forma concreta de acompañar su proceso.<\/p><\/section><section class=\"article\"><h2>Un mensaje para las niñas que sueñan con jugar fútbol<\/h2><blockquote class=\"quote\">Que nadie les diga que una cancha no es su lugar. Que nadie les haga creer que sus sueños son demasiado grandes. El fútbol también les pertenece, y cada paso que den será parte del camino que otras niñas podrán recorrer mañana.<small>MENSAJE INSTITUCIONAL · BARRACUDA F.C.<\/small><\/blockquote><\/section><section class=\"article\"><h2>Nuestro futuro también se construye con ellas<\/h2><p>El futuro del fútbol femenino depende de las oportunidades que seamos capaces de construir hoy.<\/p><p>Cada niña que recibe formación, cada joven que participa en una competición y cada mujer que encuentra un espacio para demostrar su talento representa un avance hacia un deporte más inclusivo.<\/p><p>En Barracuda F.C. creemos que formar deportistas también significa formar personas capaces de transformar positivamente sus comunidades.<\/p><p>Porque el fútbol no tiene un solo rostro, una sola historia ni un solo género.<\/p><p class=\"end\">El fútbol también tiene nombre de mujer.<\/p><\/section>"], "en": ["Football is also a woman’s game", "Talent, courage and dreams without limits", "Back to the magazine", "Back to home", "<p>Talent has no gender, dreams know no borders, and opportunities should be within reach of every girl. A look at the present and future of women’s football, from major competitions to the pitches where dreams begin.<\/p><section class=\"section\"><h2>A history of struggle, passion and perseverance<\/h2><p>For generations, girls and women faced prejudice, financial barriers and a shortage of opportunities to play the sport they loved. Yet women’s football kept moving forward. Every girl who stepped onto a pitch, every family that supported her and every coach who made room for the next generation helped change the game. Today it showcases talent, effort, leadership and determination.<\/p><\/section><section class=\"section\"><h2>The growth of women’s football around the world<\/h2><p>Talent was always there. In many places, the conditions to develop it were missing. International competitions, professional leagues, media coverage and support from sporting institutions have widened opportunities. Gaps remain in facilities, specialist coaching, funding, medical care and continuity in youth development. Progress means giving every girl the chance to start playing.<\/p><\/section><section class=\"section\"><h2>Opportunities every girl deserves<\/h2><p>Quality training suited to each stage, skilled coaching and access to competition; injury prevention, nutrition, rest and psychological support; safe environments free from discrimination, harassment and violence; and the chance to combine school with sporting and personal development.<\/p><\/section><section class=\"section\"><h2>Barracuda F.C.’s commitment to women’s football<\/h2><p>From Santa Elena, Ecuador, our U17, U19 and senior women’s teams are a core part of the club’s sporting programme. We want players to develop their abilities, compete and build a future on and off the pitch. Alongside sporting results, we value confidence, responsibility, solidarity and the courage to take on new challenges.<\/p><\/section><section class=\"section\"><h2>The role of families and society<\/h2><p>Families organise their days around training, cover transport costs and encourage their daughters even when results disappoint. Schools, governments, businesses and sporting organisations can also help create fairer conditions. Supporting women’s football is an investment in health, education, community life and social development.<\/p><\/section><section class=\"section\"><h2>What a player learns from her first training session<\/h2><p>A teenager arrives for her first practice. After misplacing a pass, she hides behind a teammate rather than asking for the ball again. A coach can help her improve her first touch and give her another chance right away. Small-group drills in which everyone receives the ball give her time to practise without spending most of the session watching others play.<\/p><p>She gradually learns to look up before passing, offer support and explain what she sees on the pitch. She also learns to ask for help, admit a mistake and listen to feedback without feeling inferior. A player who finds the courage to ask for the ball today may be the one who welcomes a newcomer tomorrow.<\/p><\/section><section class=\"section\"><h2>Giving players a reason and a way to stay<\/h2><p>Starting a girls’ team is a first step. Keeping it going means players can attend week after week. A student who leaves school shortly before practice needs to know the schedule and how she will get home. An exam that clashes with a match or costs announced at the last minute can make taking part harder.<\/p><p>Clubs can share schedules early, explain costs and ask players what is getting in the way when attendance drops. They can also review pitch allocation, coaching coverage and how often each age group gets to compete. Players need regular training and matches where they can apply what they learn.<\/p><p>At home, a short conversation at the start of the week can help organise schoolwork, rest and transport. After a match, asking “What did you learn today?” or “What would you like to improve?” gives a player space to talk about a good pass or a difficulty she wants to discuss with her coach.<\/p><\/section><section class=\"section\"><h2>A message for girls who dream of playing<\/h2><blockquote class=\"quote\">Never let anyone tell you that the pitch is not your place or that your dreams are too big. Football belongs to you too. Every step you take helps clear a path for the girls who will follow.<\/blockquote><\/section><section class=\"section\"><h2>We build our future with them<\/h2><p>The future depends on the opportunities we create today. Every girl who receives training, every young player who competes and every woman who can show her talent brings the sport closer to including everyone. At Barracuda F.C., we believe developing players also means developing people who can improve their communities. Football is also a woman’s game.<\/p><\/section>"], "pt": ["O futebol também tem nome de mulher", "Talento, coragem e sonhos sem limites", "Voltar à revista", "Voltar ao início", "<p>O talento não tem gênero, os sonhos não conhecem fronteiras e as oportunidades devem estar ao alcance de todas. Um olhar sobre o presente e o futuro do futebol feminino, das grandes competições aos campos onde os sonhos começam.<\/p><section class=\"section\"><h2>Uma história de luta, paixão e perseverança<\/h2><p>Por gerações, meninas e mulheres enfrentaram preconceitos, limitações econômicas e falta de oportunidades para jogar. Ainda assim, o futebol feminino seguiu avançando. Cada menina que entrou em campo, cada família que a apoiou e cada treinadora que abriu espaço para novas gerações ajudaram a transformar o esporte. Hoje, ele expressa talento, esforço, liderança e superação.<\/p><\/section><section class=\"section\"><h2>O crescimento do futebol feminino no mundo<\/h2><p>O talento sempre existiu. Em muitos lugares, faltavam condições para desenvolvê-lo. Competições internacionais, ligas profissionais, cobertura da mídia e apoio institucional ampliaram as oportunidades. Persistem diferenças de infraestrutura, formação técnica, financiamento, atendimento médico e continuidade dos processos de formação. Progredir significa garantir a cada menina a chance de começar a jogar.<\/p><\/section><section class=\"section\"><h2>Oportunidades para todas as meninas<\/h2><p>Treinos adequados a cada etapa, orientação técnica e acesso a competições; prevenção de lesões, nutrição, descanso e apoio psicológico; ambientes seguros, livres de discriminação, assédio e violência; e condições para conciliar os estudos com o desenvolvimento esportivo e pessoal.<\/p><\/section><section class=\"section\"><h2>O compromisso do Barracuda F.C. com o futebol feminino<\/h2><p>Em Santa Elena, no Equador, as equipes femininas sub-17, sub-19 e adultas são parte fundamental do nosso projeto esportivo. Queremos que as jogadoras desenvolvam suas capacidades, disputem competições e construam projetos de vida dentro e fora de campo. Além dos resultados, valorizamos a autoconfiança, a responsabilidade, a solidariedade e a coragem de enfrentar novos desafios.<\/p><\/section><section class=\"section\"><h2>O papel das famílias e da sociedade<\/h2><p>Famílias reorganizam suas rotinas, arcam com custos de transporte e incentivam as filhas mesmo quando os resultados não são favoráveis. Escolas, governos, empresas e organizações esportivas também podem criar condições mais justas. Apoiar o futebol feminino é investir em saúde, educação, convivência e desenvolvimento social.<\/p><\/section><section class=\"section\"><h2>O que uma jogadora aprende desde o primeiro treino<\/h2><p>Uma adolescente chega ao primeiro treino. Depois de errar um passe, evita pedir a bola novamente. A treinadora pode ajudá-la a melhorar o domínio e criar outra oportunidade de tentar. Exercícios em grupos pequenos, em que todas recebem a bola, dão tempo para praticar sem passar boa parte do treino observando as demais.<\/p><p>Aos poucos, ela aprende a levantar a cabeça antes do passe, oferecer apoio e comunicar o que percebe em campo. Também aprende a pedir ajuda, reconhecer um erro e ouvir orientações sem se sentir inferior. Quem hoje ganha coragem para pedir a bola pode amanhã acolher uma colega nova.<\/p><\/section><section class=\"section\"><h2>Condições para começar e continuar jogando<\/h2><p>Abrir uma categoria feminina é o primeiro passo. Mantê-la exige que as jogadoras possam comparecer toda semana. Uma estudante que sai da escola perto do horário do treino precisa saber quando joga e como voltará para casa. Uma prova no dia do jogo ou uma despesa anunciada em cima da hora pode dificultar a participação.<\/p><p>Os clubes podem informar os horários com antecedência, explicar os custos e conversar com as jogadoras quando começam a faltar. Também podem revisar a distribuição dos campos, o acompanhamento técnico e a frequência das competições de cada categoria. São necessários treinos regulares e jogos para colocar o aprendizado em prática.<\/p><p>Em casa, conversar no início da semana ajuda a organizar estudos, descanso e transporte. Depois da partida, perguntar «O que você aprendeu hoje?» ou «Em que gostaria de melhorar?» abre espaço para falar de um bom passe ou de uma dificuldade que merece ser conversada com a treinadora.<\/p><\/section><section class=\"section\"><h2>Uma mensagem para as meninas que sonham em jogar<\/h2><blockquote class=\"quote\">Nunca deixem que alguém diga que o campo não é o lugar de vocês ou que seus sonhos são grandes demais. O futebol também pertence a vocês. Cada passo abrirá caminho para as meninas que virão depois.<\/blockquote><\/section><section class=\"section\"><h2>Nosso futuro também se constrói com elas<\/h2><p>O futuro depende das oportunidades que construímos hoje. Cada menina que recebe formação, cada jovem que compete e cada mulher que pode mostrar seu talento torna o esporte mais inclusivo. No Barracuda F.C., acreditamos que formar atletas também é formar pessoas capazes de melhorar suas comunidades. O futebol também tem nome de mulher.<\/p><\/section>"], "fr": ["Le football se conjugue aussi au féminin", "Du talent, du courage et des rêves sans limites", "Retour à la revue", "Retour à l’accueil", "<p>Le talent n’a pas de genre, les rêves ne connaissent pas de frontières et les possibilités doivent être accessibles à toutes. Regard sur le football féminin, des grandes compétitions aux terrains où naissent les rêves.<\/p><section class=\"section\"><h2>Une histoire de lutte, de passion et de persévérance<\/h2><p>Pendant des générations, les filles et les femmes ont dû surmonter des préjugés, des difficultés économiques et un manque de possibilités pour jouer. Le football féminin a pourtant continué de progresser. Chaque fille qui est entrée sur le terrain, chaque famille qui l’a soutenue et chaque entraîneuse qui a fait une place aux nouvelles générations ont transformé le sport. Aujourd’hui, il exprime le talent, l’effort, le leadership et la persévérance.<\/p><\/section><section class=\"section\"><h2>L’essor du football féminin dans le monde<\/h2><p>Le talent a toujours existé. Dans de nombreux endroits, les moyens de le développer faisaient défaut. Les compétitions internationales, les ligues professionnelles, la couverture médiatique et les institutions sportives ont élargi les possibilités. Des inégalités subsistent dans les infrastructures, l’encadrement, le financement, les soins et la continuité de la formation. Progresser, c’est donner à chaque fille la possibilité de commencer à jouer.<\/p><\/section><section class=\"section\"><h2>Des possibilités garanties à toutes les filles<\/h2><p>Des entraînements adaptés à chaque étape, un encadrement et un accès aux compétitions; la prévention des blessures, la nutrition, le repos et le soutien psychologique; des espaces sûrs, sans discrimination, harcèlement ni violence; et la possibilité de concilier les études avec le développement sportif et personnel.<\/p><\/section><section class=\"section\"><h2>L’engagement de Barracuda F.C. pour le football féminin<\/h2><p>À Santa Elena, en Équateur, nos équipes féminines U17, U19 et seniors font partie intégrante du projet sportif du club. Nous voulons que les joueuses développent leurs capacités, participent aux compétitions et construisent leur avenir sur le terrain et en dehors. Au-delà des résultats, nous valorisons la confiance, la responsabilité, la solidarité et le courage de relever de nouveaux défis.<\/p><\/section><section class=\"section\"><h2>Le rôle des familles et de la société<\/h2><p>Les familles aménagent leur emploi du temps, financent les déplacements et encouragent leurs filles même lorsque les résultats déçoivent. Les écoles, les pouvoirs publics, les entreprises et les organisations sportives peuvent aussi agir pour l’égalité. Soutenir le football féminin, c’est investir dans la santé, l’éducation, le vivre-ensemble et le développement social.<\/p><\/section><section class=\"section\"><h2>Ce qu’une joueuse apprend dès son premier entraînement<\/h2><p>Une adolescente arrive à son premier entraînement. Après une passe manquée, elle hésite à redemander le ballon. L’entraîneuse peut l’aider à améliorer son contrôle et lui donner aussitôt une nouvelle occasion d’essayer. En petit groupe, quand chacune reçoit le ballon, elle peut s’exercer sans passer l’essentiel de la séance à regarder les autres jouer.<\/p><p>Elle apprend progressivement à lever la tête avant une passe, à proposer une solution et à communiquer sur le terrain. Elle apprend aussi à demander de l’aide, à reconnaître une erreur et à écouter un conseil sans se sentir inférieure. Celle qui ose demander le ballon aujourd’hui pourra accueillir une nouvelle joueuse demain.<\/p><\/section><section class=\"section\"><h2>Des conditions pour commencer et continuer à jouer<\/h2><p>Créer une équipe féminine est une première étape. Pour qu’elle dure, les joueuses doivent pouvoir venir chaque semaine. Une élève qui sort des cours peu avant l’entraînement doit connaître les horaires et savoir comment rentrer. Un examen le jour d’un match ou des frais annoncés au dernier moment peuvent compliquer sa participation.<\/p><p>Les clubs peuvent communiquer les horaires à l’avance, expliquer les frais et écouter les joueuses quand les absences se multiplient. Ils peuvent aussi revoir l’attribution des terrains, l’encadrement et la fréquence des matchs par catégorie. Il faut des entraînements réguliers et des matchs pour mettre en pratique les acquis.<\/p><p>À la maison, une conversation en début de semaine aide à organiser les études, le repos et les trajets. Après le match, demander «Qu’as-tu appris aujourd’hui ?» ou «Qu’aimerais-tu améliorer ?» permet de parler d’une belle passe ou d’une difficulté à aborder avec l’entraîneuse.<\/p><\/section><section class=\"section\"><h2>Un message aux filles qui rêvent de jouer<\/h2><blockquote class=\"quote\">Ne laissez personne vous dire que le terrain n’est pas votre place ou que vos rêves sont trop grands. Le football vous appartient aussi. Chacun de vos pas ouvre la voie aux filles qui suivront.<\/blockquote><\/section><section class=\"section\"><h2>Notre avenir se construit aussi avec elles<\/h2><p>L’avenir dépend des possibilités que nous créons aujourd’hui. Chaque fille qui se forme, chaque jeune joueuse qui participe à une compétition et chaque femme qui peut montrer son talent rendent le sport plus inclusif. À Barracuda F.C., former des sportives, c’est aussi former des personnes capables d’agir dans leur communauté. Le football se conjugue aussi au féminin.<\/p><\/section>"], "de": ["Fußball ist auch Frauensache", "Talent, Mut und grenzenlose Träume", "Zurück zum Magazin", "Zurück zur Startseite", "<p>Talent kennt kein Geschlecht, Träume kennen keine Grenzen und Chancen sollten allen offenstehen. Ein Blick auf den Frauenfußball, von großen Wettbewerben bis zu den Plätzen, auf denen Träume beginnen.<\/p><section class=\"section\"><h2>Eine Geschichte von Kampf, Leidenschaft und Ausdauer<\/h2><p>Über Generationen mussten Mädchen und Frauen Vorurteile, finanzielle Hürden und fehlende Spielmöglichkeiten überwinden. Trotzdem entwickelte sich der Frauenfußball weiter. Jedes Mädchen, das einen Platz betrat, jede Familie, die es unterstützte, und jede Trainerin, die der nächsten Generation Raum gab, halfen, den Sport zu verändern. Heute steht er für Talent, Einsatz, Führungsstärke und Ausdauer.<\/p><\/section><section class=\"section\"><h2>Das Wachstum des Frauenfußballs weltweit<\/h2><p>Talent war schon immer da. An vielen Orten fehlten die Bedingungen, es zu fördern. Internationale Wettbewerbe, Profiligen, Medienpräsenz und Sportinstitutionen haben mehr Möglichkeiten geschaffen. Unterschiede bestehen weiterhin bei Anlagen, Fachtraining, Finanzierung, medizinischer Betreuung und kontinuierlicher Nachwuchsförderung. Fortschritt bedeutet, jedem Mädchen den Einstieg zu ermöglichen.<\/p><\/section><section class=\"section\"><h2>Chancen, die jedem Mädchen offenstehen sollen<\/h2><p>Altersgerechtes Training, fachliche Begleitung und Zugang zu Wettbewerben; Verletzungsprävention, Ernährung, Erholung und psychologische Unterstützung; sichere Räume ohne Diskriminierung, Belästigung oder Gewalt; und die Möglichkeit, Schule mit sportlicher und persönlicher Entwicklung zu verbinden.<\/p><\/section><section class=\"section\"><h2>Das Engagement von Barracuda F.C. für den Frauenfußball<\/h2><p>In Santa Elena, Ecuador, gehören unsere U17-, U19- und Frauenmannschaften zum Kern des Vereinsprojekts. Die Spielerinnen sollen ihre Fähigkeiten entwickeln, an Wettbewerben teilnehmen und ihre Zukunft auf und neben dem Platz gestalten können. Neben sportlichen Ergebnissen zählen Selbstvertrauen, Verantwortung, Solidarität und der Mut, Neues zu wagen.<\/p><\/section><section class=\"section\"><h2>Die Rolle der Familien und der Gesellschaft<\/h2><p>Familien organisieren den Alltag rund ums Training, tragen Fahrtkosten und ermutigen ihre Töchter auch bei Enttäuschungen. Schulen, Behörden, Unternehmen und Sportorganisationen können ebenfalls zu gerechteren Bedingungen beitragen. Die Förderung des Frauenfußballs stärkt Gesundheit, Bildung, Zusammenleben und soziale Entwicklung.<\/p><\/section><section class=\"section\"><h2>Was eine Spielerin schon im ersten Training lernt<\/h2><p>Eine Jugendliche kommt zum ersten Training. Nach einem Fehlpass traut sie sich nicht mehr, den Ball zu fordern. Die Trainerin kann ihr bei der Ballannahme helfen und ihr gleich eine neue Gelegenheit geben. Übungen in kleinen Gruppen, bei denen jede den Ball bekommt, lassen ihr Zeit zum Üben, ohne dass sie den Großteil des Trainings zuschaut.<\/p><p>Nach und nach lernt sie, vor dem Pass aufzuschauen, sich anzubieten und sich auf dem Platz verständlich zu machen. Sie lernt auch, um Hilfe zu bitten, Fehler einzugestehen und Hinweise anzunehmen, ohne sich minderwertig zu fühlen. Wer heute Mut fasst und den Ball fordert, kann morgen eine neue Mitspielerin willkommen heißen.<\/p><\/section><section class=\"section\"><h2>Bedingungen für den Einstieg und fürs Dabeibleiben<\/h2><p>Eine Mädchenmannschaft zu gründen ist ein erster Schritt. Damit sie bleibt, müssen ihre Spielerinnen Woche für Woche zum Training kommen können. Wer kurz vorher aus der Schule kommt, braucht verlässliche Zeiten und eine Möglichkeit, nach Hause zu kommen. Eine Prüfung am Spieltag oder spät angekündigte Kosten können die Teilnahme erschweren.<\/p><p>Vereine können Termine früh bekannt geben, Kosten erklären und nachfragen, wenn Spielerinnen öfter fehlen. Auch Platzzeiten, Betreuung und Spielmöglichkeiten für jede Altersgruppe verdienen Aufmerksamkeit. Regelmäßiges Training und Spiele geben den Spielerinnen Gelegenheit, das Gelernte anzuwenden.<\/p><p>Zu Hause hilft ein Gespräch zu Wochenbeginn, Schule, Erholung und Fahrten abzustimmen. Nach dem Spiel lassen Fragen wie „Was hast du heute gelernt?“ oder „Was möchtest du verbessern?“ Raum für einen gelungenen Pass oder ein Problem, das die Spielerin mit ihrer Trainerin besprechen möchte.<\/p><\/section><section class=\"section\"><h2>Eine Botschaft an Mädchen, die vom Fußball träumen<\/h2><blockquote class=\"quote\">Lasst euch nicht einreden, dass ihr auf dem Platz nichts verloren habt oder eure Träume zu groß sind. Der Fußball gehört auch euch. Jeder Schritt, den ihr macht, öffnet den Weg für die Mädchen nach euch.<\/blockquote><\/section><section class=\"section\"><h2>Unsere Zukunft gestalten wir mit ihnen<\/h2><p>Die Zukunft hängt von den Chancen ab, die wir heute schaffen. Jedes Mädchen im Training, jede junge Spielerin im Wettbewerb und jede Frau, die ihr Talent zeigen kann, macht den Sport zugänglicher. Bei Barracuda F.C. bedeutet Ausbildung auch, Menschen zu stärken, die in ihrem Umfeld etwas bewirken können. Fußball ist auch Frauensache.<\/p><\/section>"], "it": ["Il calcio è anche delle donne", "Talento, coraggio e sogni senza limiti", "Torna alla rivista", "Torna alla pagina iniziale", "<p>Il talento non ha genere, i sogni non conoscono confini e le opportunità devono essere alla portata di tutte. Uno sguardo al calcio femminile, dalle grandi competizioni ai campi in cui nascono i sogni.<\/p><section class=\"section\"><h2>Una storia di lotta, passione e perseveranza<\/h2><p>Per generazioni, bambine e donne hanno affrontato pregiudizi, difficoltà economiche e poche opportunità di giocare. Eppure il calcio femminile ha continuato a crescere. Ogni bambina entrata in campo, ogni famiglia che l’ha sostenuta e ogni allenatrice che ha dato spazio alle nuove generazioni ha contribuito a cambiare lo sport. Oggi è espressione di talento, impegno, leadership e tenacia.<\/p><\/section><section class=\"section\"><h2>La crescita del calcio femminile nel mondo<\/h2><p>Il talento c’è sempre stato. In molti luoghi mancavano le condizioni per svilupparlo. Competizioni internazionali, campionati professionistici, copertura mediatica e istituzioni sportive hanno ampliato le opportunità. Restano differenze nelle strutture, nella preparazione tecnica, nei finanziamenti, nell’assistenza medica e nella continuità della formazione. Progredire significa garantire a ogni bambina la possibilità di cominciare a giocare.<\/p><\/section><section class=\"section\"><h2>Opportunità per tutte le bambine<\/h2><p>Allenamenti adatti a ogni fase, sostegno tecnico e accesso alle competizioni; prevenzione degli infortuni, alimentazione, riposo e sostegno psicologico; ambienti sicuri, senza discriminazioni, molestie né violenza; e la possibilità di conciliare gli studi con la crescita sportiva e personale.<\/p><\/section><section class=\"section\"><h2>L’impegno di Barracuda F.C. per il calcio femminile<\/h2><p>A Santa Elena, in Ecuador, le squadre femminili Under 17, Under 19 e senior sono parte fondamentale del progetto sportivo del club. Vogliamo che le giocatrici sviluppino le proprie capacità, partecipino alle competizioni e costruiscano il loro futuro dentro e fuori dal campo. Oltre ai risultati, contano fiducia, responsabilità, solidarietà e coraggio nell’affrontare nuove sfide.<\/p><\/section><section class=\"section\"><h2>Il ruolo delle famiglie e della società<\/h2><p>Le famiglie riorganizzano le giornate, sostengono le spese di trasporto e incoraggiano le figlie anche quando i risultati deludono. Scuole, amministrazioni, aziende e organizzazioni sportive possono contribuire a condizioni più eque. Sostenere il calcio femminile significa investire nella salute, nell’istruzione, nella convivenza e nello sviluppo sociale.<\/p><\/section><section class=\"section\"><h2>Che cosa impara una giocatrice dal primo allenamento<\/h2><p>Un’adolescente arriva al primo allenamento. Dopo un passaggio sbagliato esita a chiedere di nuovo il pallone. L’allenatrice può aiutarla a migliorare il controllo e darle subito un’altra occasione. Negli esercizi in piccoli gruppi, dove tutte ricevono la palla, può fare pratica senza passare gran parte della seduta a guardare le altre.<\/p><p>A poco a poco impara ad alzare lo sguardo prima del passaggio, a offrirsi come appoggio e a comunicare sul campo. Impara anche a chiedere aiuto, riconoscere un errore e ascoltare una correzione senza sentirsi inferiore. Chi oggi trova il coraggio di chiedere palla può domani accogliere una nuova compagna.<\/p><\/section><section class=\"section\"><h2>Condizioni per iniziare e continuare a giocare<\/h2><p>Aprire una categoria femminile è un primo passo. Per mantenerla, le giocatrici devono poter partecipare ogni settimana. Una studentessa che esce da scuola poco prima dell’allenamento ha bisogno di conoscere gli orari e di sapere come tornare a casa. Un esame il giorno della partita o una spesa comunicata all’ultimo momento può rendere difficile partecipare.<\/p><p>I club possono anticipare gli orari, spiegare i costi e ascoltare le giocatrici quando iniziano ad assentarsi. Possono anche rivedere l’assegnazione dei campi, la presenza degli allenatori e la frequenza delle partite per ogni categoria. Servono allenamenti regolari e partite in cui mettere in pratica quanto appreso.<\/p><p>A casa, parlarne all’inizio della settimana aiuta a organizzare studio, riposo e trasporti. Dopo la partita, domande come «Che cosa hai imparato oggi?» o «In che cosa vorresti migliorare?» lasciano spazio per un bel passaggio o per una difficoltà da discutere con l’allenatrice.<\/p><\/section><section class=\"section\"><h2>Un messaggio alle bambine che sognano di giocare<\/h2><blockquote class=\"quote\">Non lasciate che qualcuno vi dica che il campo non è il vostro posto o che i vostri sogni sono troppo grandi. Il calcio appartiene anche a voi. Ogni passo apre la strada alle bambine che verranno dopo.<\/blockquote><\/section><section class=\"section\"><h2>Il nostro futuro si costruisce anche con loro<\/h2><p>Il futuro dipende dalle opportunità che creiamo oggi. Ogni bambina che si allena, ogni giovane che partecipa a una competizione e ogni donna che mostra il proprio talento rendono lo sport più inclusivo. Per Barracuda F.C., formare atlete significa anche formare persone capaci di migliorare le proprie comunità. Il calcio è anche delle donne.<\/p><\/section>"]};

const picker = document.getElementById('language');
function showArticle(code) {
  const lang = Object.hasOwn(articles, code) ? code : 'es';
  const [title, subtitle, back, home, copy] = articles[lang];
  const [review, number, magazine, cover, training, team] = labels[lang];
  document.documentElement.lang = picker.value = lang;
  document.title = title + ' · Barracuda F.C.';
  document.getElementById('title').textContent = title;
  document.getElementById('subtitle').textContent = subtitle;
  
  document.getElementById('date').textContent = number;
  document.getElementById('magazine').textContent = magazine + ' · DISCIPLINA · UNIÓN · GRANDEZA';
  document.getElementById('copy').innerHTML = copy;
  document.querySelector('.cover img').alt = cover;
  const photos = document.querySelectorAll('.photos img');
  photos[0].alt = training;
  photos[1].alt = team;
  document.querySelectorAll('.return').forEach(nav => {
    nav.setAttribute('aria-label', magazine);
    nav.children[0].textContent = back;
    nav.children[1].textContent = home;
  });
  history.replaceState(null, '', '#' + lang);
}
picker.addEventListener('change', () => showArticle(picker.value));
