dding:22px}.hero{padding:42px 22px 48px}.top{padding:10px 16px}.top b{font-size:16px}.top img{width:48px;height:60px}.main{padding:22px 12px 60px}}@media print{.preview,.toc,.btn{display:none}.section{break-inside:avoid;box-shadow:none;border:1px solid #ddd}.hero{background:#65102b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style><style>.editorial-photo{margin:18px 0 28px;border-radius:16px;overflow:hidden;background:#f7eff0;box-shadow:0 8px 24px #3b10201c}.editorial-photo img{width:100%;max-height:360px;object-fit:cover;display:block}.editorial-photo figcaption{font:12px Arial,sans-serif;color:#725d65;padding:9px 14px;background:#fff}</style><style>.langbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:16px;background:#fbf5ed;border-bottom:1px solid #ead8c0;font:600 13px Arial,sans-serif;position:sticky;top:0;z-index:99}.langbar label{color:#51182f}.langbar select{border:1px solid #b78c57;background:white;border-radius:8px;padding:9px 14px;color:#51182f;font:600 14px Arial,sans-serif;max-width:100%}</style><style id="bfc-article-return-style">

<nav class="bfc-article-return" aria-label="Navegación del artículo"><a href="/articulos-formativos/index.html">Volver a la revista</a><a href="/">Volver al inicio</a></nav><div class="langbar"><label for="idioma-art6">IDIOMA / LANGUAGE</label><select aria-label="Seleccionar idioma" id="idioma-art6"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></div><div id="article-content"></div><script>const articleVersions={"es": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>REVISTA DIGITAL · DISCIPLINA · UNIÓN · GRANDEZA<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Artículo N.º 6 · 18 de noviembre de 2026<\/div><h1>¡Formamos campeones para el <span class=\"gold\">fútbol y para la vida!<\/span><\/h1><p>La disciplina, el respeto y los valores que construyen grandes deportistas y mejores personas.<\/p><div class=\"tags\"><span class=\"tag\">Formación humana<\/span><span class=\"tag\">Familias<\/span><span class=\"tag\">Deporte con valores<\/span><span class=\"tag\">Español<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Introducción<\/div><h2>El verdadero campeón se forma dentro y fuera de la cancha<\/h2><p>Cada niño que llega a Barracuda F.C. trae consigo un sueño. Algunos quieren marcar el gol decisivo de una final, otros desean representar a su provincia y muchos imaginan convertirse algún día en futbolistas profesionales.<\/p><p>Pero detrás de cada sueño deportivo existe una responsabilidad todavía más importante: formar personas honestas, disciplinadas, respetuosas y solidarias. El fútbol nos ofrece oportunidades extraordinarias para aprender a convivir, superar dificultades, trabajar en equipo y comprender que el éxito no siempre se mide en trofeos.<\/p><p><strong>En Barracuda F.C. no queremos formar únicamente buenos futbolistas. Queremos contribuir a formar seres humanos capaces de transformar positivamente sus familias y comunidades.<\/strong><\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Equipo unido antes del partido · Ilustración conceptual generada para revisión; indumentaria pendiente de validación.<\/figcaption><\/figure><details class=\"toc\"><summary>Explorar los 14 apartados del artículo<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. El fútbol como escuela para la vida<\/a><a href=\"#s02\">02. La disciplina: pequeños hábitos, grandes resultados<\/a><a href=\"#s03\">03. El respeto: tratar a los demás como queremos ser tratados<\/a><a href=\"#s04\">04. Aprender a ganar y también a perder<\/a><a href=\"#s05\">05. Honestidad y juego limpio<\/a><a href=\"#s06\">06. Unión, solidaridad e inclusión: nadie debe sentirse solo<\/a><a href=\"#s07\">07. Perseverancia: los errores también enseñan<\/a><a href=\"#s08\">08. Los valores también se practican en las redes sociales<\/a><a href=\"#s09\">09. Los padres: acompañar sin presionar<\/a><a href=\"#s10\">10. El entrenador: educar mediante el ejemplo<\/a><a href=\"#s11\">11. Diez compromisos del pequeño gran futbolista Barracuda<\/a><a href=\"#s12\">12. Una actividad especial: el partido de los valores<\/a><a href=\"#s13\">13. El desafío familiar: siete días practicando valores<\/a><a href=\"#s14\">14. Barracuda F.C.: un compromiso que trasciende generaciones<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>El fútbol como escuela para la vida<\/h2><\/div><p>En un equipo conviven niños con diferentes personalidades, habilidades, experiencias y condiciones familiares. Aprender a compartir ese espacio es una de las primeras enseñanzas del deporte. Un jugador aprende a esperar su turno, escuchar indicaciones, respetar reglas y colaborar con compañeros que pueden pensar o actuar de manera diferente.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Situación para reflexionar: un compañero nuevo tiene dificultades para controlar el balón. En lugar de burlarse o excluirlo, podemos animarlo, ayudarlo y recordar que todos necesitamos tiempo para aprender.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad familiar: al finalizar el entrenamiento, preguntar «¿A quién ayudaste hoy?» y «¿Quién te ayudó a ti?».<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>La disciplina: pequeños hábitos, grandes resultados<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Respeto y saludo entre futbolistas · Ilustración conceptual generada para revisión; indumentaria pendiente de validación.<\/figcaption><\/figure><p>La disciplina se construye mediante acciones cotidianas: llegar a tiempo, preparar el uniforme, cumplir las tareas escolares y respetar los compromisos. No debe confundirse con el miedo o el castigo. Requiere reglas claras, explicaciones adecuadas y consecuencias proporcionales y respetuosas.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Ejemplo: si un niño olvida sus implementos, la familia puede ayudarlo a preparar su mochila y permitirle asumir gradualmente esa responsabilidad.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Reto de siete días: preparar el uniforme, llegar puntualmente, cumplir tareas escolares, respetar el descanso, ayudar en casa, escuchar al entrenador y reconocer un error.<\/div><\/div><div class=\"checklist\"><strong>Marca los hábitos practicados esta semana:<\/strong><label><input type=\"checkbox\"/>Preparé mi uniforme y mis implementos<\/label><label><input type=\"checkbox\"/>Llegué puntualmente<\/label><label><input type=\"checkbox\"/>Cumplí mis tareas escolares<\/label><label><input type=\"checkbox\"/>Respeté mis horarios de descanso<\/label><label><input type=\"checkbox\"/>Ayudé en casa<\/label><label><input type=\"checkbox\"/>Escuché al entrenador<\/label><label><input type=\"checkbox\"/>Reconocí un error y busqué corregirlo<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Reiniciar reto<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>El respeto: tratar a los demás como queremos ser tratados<\/h2><\/div><p>El respeto no depende del resultado deportivo ni del nivel de habilidad. Todos los jugadores merecen un trato digno. Respetar significa escuchar, evitar insultos, aceptar las diferencias y reconocer que los errores forman parte del aprendizaje.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Tres situaciones: cuando alguien falla un penalti, lo animamos; si no estamos de acuerdo con el árbitro, hablamos con respeto; cuando un compañero juega menos minutos, reconocemos su esfuerzo.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad: representar estas situaciones en casa y conversar sobre cómo se siente cada persona.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Aprender a ganar y también a perder<\/h2><\/div><p>Ganar es motivo de alegría. Perder puede provocar frustración. Ambas experiencias permiten desarrollar madurez emocional. Los padres deben permitir que sus hijos expresen lo que sienten sin ridiculizarlos ni exigirles que oculten sus emociones.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Un niño que llora después de una derrota puede necesitar comprensión, tiempo y acompañamiento.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Tres preguntas después del partido: ¿Qué disfrutaste? ¿Qué aprendiste? ¿Qué te gustaría mejorar?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Honestidad y juego limpio<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Trabajo en equipo y solidaridad · Ilustración conceptual generada para revisión; indumentaria pendiente de validación.<\/figcaption><\/figure><p>La honestidad es uno de los valores fundamentales de Barracuda F.C. Un futbolista honesto respeta las reglas, reconoce sus errores y no intenta obtener ventajas mediante el engaño.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Ejemplo: si el balón tocó nuestro pie antes de salir, reconocerlo aunque el árbitro no lo haya visto demuestra integridad.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad familiar: recordar una ocasión en la que decir la verdad fue difícil y conversar sobre lo aprendido.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Unión, solidaridad e inclusión: nadie debe sentirse solo<\/h2><\/div><p>La unión no significa pensar todos igual. Significa que las diferencias no impiden trabajar por un objetivo común. Un equipo solidario ayuda a sus compañeros y procura que todos se sientan parte del grupo. La inclusión exige rechazar las burlas y la discriminación.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Una acción pequeña puede cambiar el día de un compañero que se siente desanimado.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Desafío: realizar una buena acción por un compañero durante la semana, sin esperar recompensa.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>Perseverancia: los errores también enseñan<\/h2><\/div><p>Nadie nace dominando todas las habilidades del fútbol. Aprender a conducir el balón, mejorar un pase o comprender una estrategia requiere práctica, paciencia y orientación. Perseverar no significa ignorar el dolor o el cansancio.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Cada niño progresa a su ritmo. Los adultos deben valorar los avances sin comparaciones negativas.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Mi pequeña meta semanal: elegir una habilidad realista, practicarla y conversar con el entrenador sobre los avances.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Los valores también se practican en las redes sociales<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Familia acompañando a un joven futbolista · Ilustración conceptual generada para revisión; indumentaria pendiente de validación.<\/figcaption><\/figure><p>Compartir fotografías sin autorización, difundir rumores, insultar o ridiculizar a otra persona contradice el respeto y la solidaridad. Antes de publicar, conviene pensar si el contenido puede lastimar a alguien o si necesitamos permiso.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Semáforo digital: verde para felicitar respetuosamente; amarillo para detenerse y pedir autorización; rojo para insultos, humillaciones, datos privados o fotos sin consentimiento.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad: revisar ejemplos ficticios de publicaciones y decidir juntos qué sería correcto compartir.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>Los padres: acompañar sin presionar<\/h2><\/div><p>Los padres son referentes de comportamiento. Cuando un adulto insulta al árbitro o humilla a un jugador, transmite un mensaje contrario a los valores que queremos enseñar. Acompañar significa apoyar, escuchar y reconocer el esfuerzo.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Cinco compromisos: animar sin insultar, reconocer el esfuerzo, dialogar respetuosamente, evitar comparaciones y recordar que el fútbol debe ser formativo.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad: después del partido, escuchar primero al niño antes de ofrecer consejos o críticas.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>El entrenador: educar mediante el ejemplo<\/h2><\/div><p>El entrenador influye en el desarrollo técnico, la confianza y el comportamiento de sus jugadores. Corregir sin humillar, escuchar sin discriminar y establecer normas claras son responsabilidades esenciales.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Cuando dos compañeros discuten, el entrenador puede escuchar a ambos y ayudarlos a resolver el desacuerdo mediante el diálogo.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>Actividad para el equipo: acordar juntos tres normas de convivencia y revisarlas periódicamente.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>Diez compromisos del pequeño gran futbolista Barracuda<\/h2><\/div><p>Los valores cobran fuerza cuando se convierten en acciones. Este decálogo puede leerse en familia y utilizarse como actividad de reflexión en los entrenamientos.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>Seré puntual y responsable.<\/label><label><input type=\"checkbox\"/>Respetaré a todos mis compañeros.<\/label><label><input type=\"checkbox\"/>Escucharé a mis entrenadores.<\/label><label><input type=\"checkbox\"/>Jugaré con honestidad.<\/label><label><input type=\"checkbox\"/>Ayudaré a quien lo necesite.<\/label><label><input type=\"checkbox\"/>Aceptaré mis errores y aprenderé de ellos.<\/label><label><input type=\"checkbox\"/>Celebraré las victorias con humildad.<\/label><label><input type=\"checkbox\"/>Afrontaré las derrotas con dignidad.<\/label><label><input type=\"checkbox\"/>Cuidaré mis estudios, mi salud y mi familia.<\/label><label><input type=\"checkbox\"/>Representaré con orgullo los valores de Barracuda F.C.<\/label><\/div><p class=\"meta\">Puedes marcar cada compromiso mientras lo conversas en familia.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Una actividad especial: el partido de los valores<\/h2><\/div><p>Durante un partido amistoso, el entrenador observa no solo las acciones deportivas, sino también las manifestaciones de respeto, compañerismo, honestidad y solidaridad.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Al terminar, cada jugador reconoce una buena acción realizada por otro compañero. Los padres también pueden destacar actitudes positivas.<\/div><\/div><div class=\"activity\"><strong>Para practicar en familia<\/strong><div>El objetivo no es competir por quién es mejor persona, sino reconocer conductas que fortalecen la convivencia.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>El desafío familiar: siete días practicando valores<\/h2><\/div><p>Cada día ofrece una oportunidad para practicar un valor diferente. La familia puede completar este pequeño calendario y conversar sobre lo aprendido.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Lunes · Disciplina<\/b><br/>Preparar los implementos deportivos y cumplir una responsabilidad en casa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Martes · Respeto<\/b><br/>Escuchar a otra persona sin interrumpir.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Miércoles · Solidaridad<\/b><br/>Ayudar a alguien sin esperar recompensa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Jueves · Honestidad<\/b><br/>Reconocer un error y conversar sobre cómo corregirlo.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Viernes · Unión<\/b><br/>Realizar una actividad en familia donde todos colaboren.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Sábado · Perseverancia<\/b><br/>Practicar una habilidad y reconocer un avance.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span><b>Domingo · Gratitud<\/b><br/>Agradecer a quienes nos apoyaron durante la semana.<\/span><\/label><\/div><\/div><p class=\"meta\">Las marcas se conservan solo mientras esta página permanezca abierta.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>Barracuda F.C.: un compromiso que trasciende generaciones<\/h2><\/div><p>Desde nuestra fundación, el 29 de abril de 2017, Barracuda F.C. ha buscado contribuir al desarrollo deportivo y humano de niños, adolescentes y jóvenes de nuestra comunidad. Nuestros valores institucionales —honestidad, transparencia, disciplina, inclusión, respeto, solidaridad y excelencia— constituyen una guía para nuestras actividades. Aspiramos a que cada jugador lleve estas enseñanzas consigo, incluso cuando termine su etapa deportiva.<\/p><div class=\"note\"><strong>Para reflexionar<\/strong><div>Un campeonato puede recordarse durante años, pero una buena formación puede acompañar a una persona durante toda su vida.<\/div><\/div><\/section><div class=\"quote\">«Un trofeo puede llenar una vitrina, pero los valores construyen una vida».<br/><span style=\"font-size:16px;font-weight:normal\">Que cada jugador sea reconocido no solo por su talento, sino también por su calidad humana.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Revista Digital · Artículo 6<\/small><\/footer>", "en": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>DIGITAL MAGAZINE · DISCIPLINE · UNITY · GREATNESS<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Article No. 6 · 18 November 2026<\/div><h1>We develop champions for <span>football and for life!<\/span><\/h1><p>Discipline, respect and values that shape great athletes and better people.<\/p><div class=\"tags\"><span class=\"tag\">Human development<\/span><span class=\"tag\">Families<\/span><span class=\"tag\">Sport with values<\/span><span class=\"tag\">English<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Introduction<\/div><h2>A true champion grows on and off the pitch<\/h2><p>Every child who arrives at Barracuda F.C. brings a dream. Some want to score the winning goal in a final, others hope to represent their province, and many imagine becoming professional footballers one day.<\/p><p>But behind every sporting dream lies an even more important responsibility: developing honest, disciplined, respectful and supportive people. Football gives us extraordinary opportunities to learn to live together, overcome difficulties, work as a team and understand that success is not always measured in trophies.<\/p><p>At Barracuda F.C., we do not want to develop only good footballers. We want to help raise people who can make a positive difference in their families and communities.<\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Team united before the match · Conceptual illustration for review; kit pending approval.<\/figcaption><\/figure><details class=\"toc\"><summary>Explore the 14 sections of the article<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. A true champion grows on and off the pitch<\/a><a href=\"#s02\">02. Football as a school for life<\/a><a href=\"#s03\">03. Discipline: small habits, big results<\/a><a href=\"#s04\">04. Respect: treat others as we wish to be treated<\/a><a href=\"#s05\">05. Learning to win and to lose<\/a><a href=\"#s06\">06. Honesty and fair play<\/a><a href=\"#s07\">07. Unity, solidarity and inclusion: no one should feel alone<\/a><a href=\"#s08\">08. Perseverance: mistakes also teach us<\/a><a href=\"#s09\">09. Values matter on social media too<\/a><a href=\"#s10\">10. Parents: support without pressure<\/a><a href=\"#s11\">11. Coaches: teach by example<\/a><a href=\"#s12\">12. Ten commitments of a young Barracuda footballer<\/a><a href=\"#s13\">13. A special activity: the values match<\/a><a href=\"#s14\">14. The family challenge: seven days of values<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>A true champion grows on and off the pitch<\/h2><\/div><p>A team brings together children with different personalities, abilities, experiences and family circumstances. Sharing this space is one of sport’s first lessons. Players learn to wait their turn, listen to instructions, respect the rules and cooperate with teammates who may think or act differently.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>A new teammate struggles to control the ball. Rather than mocking or excluding them, we can encourage them, help them and celebrate their progress.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Family activity: after training, ask 'Who did you help today?' and 'Who helped you?'<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>Football as a school for life<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Respect and greetings between footballers · Conceptual illustration for review; kit pending approval.<\/figcaption><\/figure><p>Discipline is built through everyday actions: arriving on time, preparing the kit, completing schoolwork and keeping commitments. It should not be confused with fear or punishment. It requires clear rules, appropriate explanations and proportionate, respectful consequences.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>If a child forgets their equipment, the family can help prepare their bag and gradually let them take responsibility.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Seven-day challenge: prepare your kit, arrive on time, complete schoolwork, respect rest, help at home, listen to the coach and correct mistakes.<\/div><\/div><div class=\"checklist\"><strong>Check the habits you practised this week:<\/strong><label><input type=\"checkbox\"/>I prepared my kit and equipment<\/label><label><input type=\"checkbox\"/>I arrived on time<\/label><label><input type=\"checkbox\"/>I completed my schoolwork<\/label><label><input type=\"checkbox\"/>I respected my rest schedule<\/label><label><input type=\"checkbox\"/>I helped at home<\/label><label><input type=\"checkbox\"/>I listened to the coach<\/label><label><input type=\"checkbox\"/>I acknowledged a mistake and tried to correct it<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Reset challenge<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>Discipline: small habits, big results<\/h2><\/div><p>Respect does not depend on results or skill level. Every player deserves dignity. Respect means listening, avoiding insults, accepting differences and understanding that mistakes are part of learning.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>Three situations: when someone misses a penalty, we encourage them; if we disagree with the referee, we speak respectfully; when a teammate plays differently, we include them.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Activity: act out these situations at home and discuss how each person feels.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Respect: treat others as we wish to be treated<\/h2><\/div><p>Winning brings joy; losing may bring frustration. Both experiences develop emotional maturity. Parents should let children express their feelings without mocking them or demanding that they hide their emotions.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>A child who cries after losing may need understanding, time and support.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Three questions after the match: What did you enjoy? What did you learn? What would you like to improve?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Learning to win and to lose<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Teamwork and solidarity · Conceptual illustration for review; kit pending approval.<\/figcaption><\/figure><p>Honesty is one of Barracuda F.C.’s fundamental values. An honest footballer respects the rules, acknowledges mistakes and does not seek an unfair advantage through deception.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>If the ball touched our foot before going out, admitting it even when the referee did not see shows integrity.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Family activity: remember a time when telling the truth was difficult and discuss what you learned.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Honesty and fair play<\/h2><\/div><p>Unity does not mean everyone thinks alike. Differences need not prevent us from pursuing a shared goal. Supportive teams help their members and make everyone feel included. Inclusion means rejecting mockery and discrimination.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>A small action can change the day of a teammate who feels discouraged.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Challenge: do a kind deed for a teammate during the week without expecting a reward.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>Unity, solidarity and inclusion: no one should feel alone<\/h2><\/div><p>Nobody is born knowing every football skill. Dribbling, improving a pass and understanding tactics take practice, patience and guidance. Perseverance does not mean ignoring pain or exhaustion.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>Every child progresses at their own pace. Adults should value improvement without negative comparisons.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>My small weekly goal: choose a realistic skill, practise it and discuss your progress with the coach.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Perseverance: mistakes also teach us<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Family supporting a young footballer · Conceptual illustration for review; kit pending approval.<\/figcaption><\/figure><p>Sharing photos without permission, spreading rumours, insulting or mocking someone contradicts respect and solidarity. Before posting, consider whether the content might hurt someone or whether consent is needed.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>Digital traffic light: green for respectful congratulations; yellow for stopping to request permission; red for insults, humiliation, private information or hurtful content.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Activity: review fictional social media posts and decide together what is appropriate to share.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>Values matter on social media too<\/h2><\/div><p>Parents are role models. When an adult insults a referee or humiliates a player, the message contradicts the values we aim to teach. Supporting means listening, encouraging and recognising effort.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>Five commitments: encourage without insulting, recognise effort, speak respectfully, avoid comparisons and remember that football should educate.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Activity: after the match, listen to the child before giving advice or criticism.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>Parents: support without pressure<\/h2><\/div><p>Coaches influence players’ technique, confidence and behaviour. Correcting without humiliation, listening without discrimination and setting clear rules are essential responsibilities.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>When two teammates argue, the coach can listen to both and help them resolve their disagreement through dialogue.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>Team activity: agree on three rules for getting along and review them regularly.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>Coaches: teach by example<\/h2><\/div><p>Values become stronger when they turn into actions. These ten commitments can be read together as a family and discussed during training.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>I will be punctual and responsible.<\/label><label><input type=\"checkbox\"/>I will respect all my teammates.<\/label><label><input type=\"checkbox\"/>I will listen to my coaches.<\/label><label><input type=\"checkbox\"/>I will play honestly.<\/label><label><input type=\"checkbox\"/>I will help anyone who needs it.<\/label><label><input type=\"checkbox\"/>I will accept my mistakes and learn from them.<\/label><label><input type=\"checkbox\"/>I will celebrate victories with humility.<\/label><label><input type=\"checkbox\"/>I will face defeats with dignity.<\/label><label><input type=\"checkbox\"/>I will care for my studies, health and family.<\/label><label><input type=\"checkbox\"/>I will proudly represent Barracuda F.C.'s values.<\/label><\/div><p class=\"meta\">You can tick each commitment as you discuss it with your family.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Ten commitments of a young Barracuda footballer<\/h2><\/div><p>During a friendly match, the coach observes not only sporting performance but also respect, teamwork, honesty and solidarity.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>At the end, each player recognises a good action by another teammate. Parents can also highlight positive attitudes.<\/div><\/div><div class=\"activity\"><strong>To practise as a family<\/strong><div>The goal is not to compete over who is a better person, but to recognise behaviour that strengthens relationships.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>A special activity: the values match<\/h2><\/div><p>Each day offers an opportunity to practise a different value. Families can complete a simple weekly calendar and discuss what they have learned.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span>Prepare sports equipment and fulfil a responsibility at home.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Listen to someone without interrupting.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Help someone without expecting a reward.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Admit a mistake and discuss how to correct it.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Do a family activity in which everyone contributes.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Practise a skill and recognise an improvement.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Thank those who supported us during the week.<\/span><\/label><\/div><\/div><p class=\"meta\">Your selections remain only while this page is open.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>The family challenge: seven days of values<\/h2><\/div><p>Since our founding on 29 April 2017, Barracuda F.C. has sought to contribute to the sporting and personal development of children, teenagers and young people in our community. Our institutional values—honesty, transparency, discipline, inclusion, respect, solidarity and excellence—guide our activities. We hope every player carries these lessons throughout life, even after their sporting years are over.<\/p><div class=\"note\"><strong>To reflect<\/strong><div>A championship may be remembered for years, but good education can accompany a person throughout life.<\/div><\/div><\/section><div class=\"quote\">'A trophy can fill a display cabinet, but values build a life.'<br/><span style=\"font-size:16px;font-weight:normal\">May every player be recognised not only for talent, but also for character.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Digital Magazine · Article 6<\/small><\/footer>", "pt": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>REVISTA DIGITAL · DISCIPLINA · UNIÃO · GRANDEZA<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Artigo nº 6 · 18 de novembro de 2026<\/div><h1>Formamos campeões para o <span>futebol e para a vida!<\/span><\/h1><p>Disciplina, respeito e valores que formam grandes atletas e pessoas melhores.<\/p><div class=\"tags\"><span class=\"tag\">Formação humana<\/span><span class=\"tag\">Famílias<\/span><span class=\"tag\">Esporte com valores<\/span><span class=\"tag\">Português<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Introdução<\/div><h2>O verdadeiro campeão se forma dentro e fora de campo<\/h2><p>Cada criança que chega ao Barracuda F.C. traz consigo um sonho. Algumas querem marcar o gol decisivo de uma final, outras desejam representar sua província e muitas imaginam tornar-se futebolistas profissionais um dia.<\/p><p>Mas por trás de cada sonho esportivo existe uma responsabilidade ainda mais importante: formar pessoas honestas, disciplinadas, respeitosas e solidárias. O futebol oferece oportunidades extraordinárias para aprender a conviver, superar dificuldades, trabalhar em equipe e entender que o sucesso nem sempre se mede por troféus.<\/p><p>No Barracuda F.C., não queremos formar apenas bons jogadores. Queremos ajudar a formar seres humanos capazes de transformar positivamente suas famílias e comunidades.<\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Equipe unida antes da partida · Ilustração conceitual para revisão; uniforme pendente de validação.<\/figcaption><\/figure><details class=\"toc\"><summary>Explorar as 14 seções do artigo<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. O verdadeiro campeão se forma dentro e fora de campo<\/a><a href=\"#s02\">02. O futebol como escola para a vida<\/a><a href=\"#s03\">03. Disciplina: pequenos hábitos, grandes resultados<\/a><a href=\"#s04\">04. Respeito: tratar os outros como queremos ser tratados<\/a><a href=\"#s05\">05. Aprender a ganhar e também a perder<\/a><a href=\"#s06\">06. Honestidade e jogo limpo<\/a><a href=\"#s07\">07. União, solidariedade e inclusão: ninguém deve se sentir sozinho<\/a><a href=\"#s08\">08. Perseverança: os erros também ensinam<\/a><a href=\"#s09\">09. Os valores também se praticam nas redes sociais<\/a><a href=\"#s10\">10. Os pais: apoiar sem pressionar<\/a><a href=\"#s11\">11. O treinador: educar pelo exemplo<\/a><a href=\"#s12\">12. Dez compromissos do jovem jogador Barracuda<\/a><a href=\"#s13\">13. Uma atividade especial: a partida dos valores<\/a><a href=\"#s14\">14. O desafio familiar: sete dias praticando valores<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>O verdadeiro campeão se forma dentro e fora de campo<\/h2><\/div><p>Uma equipe reúne crianças com personalidades, habilidades, experiências e realidades familiares diferentes. Compartilhar esse espaço é uma das primeiras lições do esporte. Cada jogador aprende a esperar sua vez, ouvir orientações, respeitar regras e colaborar com colegas diferentes.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Um novo colega tem dificuldade para dominar a bola. Em vez de zombar ou excluí-lo, podemos incentivá-lo, ajudá-lo e valorizar seus avanços.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade em família: depois do treino, perguntar 'Quem você ajudou hoje?' e 'Quem ajudou você?'<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>O futebol como escola para a vida<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Respeito e cumprimento entre jogadores · Ilustração conceitual para revisão; uniforme pendente de validação.<\/figcaption><\/figure><p>A disciplina nasce de atitudes diárias: chegar na hora, preparar o uniforme, cumprir as tarefas escolares e honrar compromissos. Não deve ser confundida com medo ou castigo. Exige regras claras, explicações adequadas e consequências proporcionais e respeitosas.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Se uma criança esquece seus materiais, a família pode ajudá-la a preparar a mochila e permitir que assuma essa responsabilidade aos poucos.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Desafio de sete dias: preparar o uniforme, chegar no horário, cumprir tarefas escolares, respeitar o descanso, ajudar em casa, ouvir o treinador e corrigir erros.<\/div><\/div><div class=\"checklist\"><strong>Marque os hábitos praticados nesta semana:<\/strong><label><input type=\"checkbox\"/>Preparei meu uniforme e materiais<\/label><label><input type=\"checkbox\"/>Cheguei pontualmente<\/label><label><input type=\"checkbox\"/>Cumpri minhas tarefas escolares<\/label><label><input type=\"checkbox\"/>Respeitei meus horários de descanso<\/label><label><input type=\"checkbox\"/>Ajudei em casa<\/label><label><input type=\"checkbox\"/>Ouvi o treinador<\/label><label><input type=\"checkbox\"/>Reconheci um erro e tentei corrigi-lo<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Reiniciar desafio<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>Disciplina: pequenos hábitos, grandes resultados<\/h2><\/div><p>O respeito não depende do resultado ou da habilidade. Todos merecem dignidade. Respeitar é ouvir, evitar insultos, aceitar diferenças e compreender que os erros fazem parte da aprendizagem.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Três situações: quando alguém erra um pênalti, incentivamos; se discordamos do árbitro, falamos com respeito; quando um colega joga de modo diferente, nós o incluímos.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade: representar essas situações em casa e conversar sobre como cada pessoa se sente.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Respeito: tratar os outros como queremos ser tratados<\/h2><\/div><p>Ganhar traz alegria; perder pode causar frustração. As duas experiências desenvolvem maturidade emocional. Os pais devem permitir que os filhos expressem seus sentimentos sem ridicularizá-los ou exigir que escondam suas emoções.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Uma criança que chora após uma derrota pode precisar de compreensão, tempo e apoio.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Três perguntas após o jogo: Do que você gostou? O que aprendeu? O que gostaria de melhorar?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Aprender a ganhar e também a perder<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Trabalho em equipe e solidariedade · Ilustração conceitual para revisão; uniforme pendente de validação.<\/figcaption><\/figure><p>A honestidade é um dos valores fundamentais do Barracuda F.C. Um jogador honesto respeita as regras, reconhece seus erros e não busca vantagens por meio de enganos.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Se a bola tocou nosso pé antes de sair, reconhecer isso mesmo que o árbitro não tenha visto demonstra integridade.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade em família: lembrar uma ocasião em que dizer a verdade foi difícil e conversar sobre o aprendizado.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Honestidade e jogo limpo<\/h2><\/div><p>União não significa pensar da mesma maneira. As diferenças não impedem a busca de um objetivo comum. Uma equipe solidária ajuda seus integrantes e faz com que todos se sintam incluídos. Inclusão exige rejeitar zombarias e discriminação.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Uma pequena atitude pode mudar o dia de um colega desanimado.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Desafio: fazer uma boa ação por um colega durante a semana, sem esperar recompensa.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>União, solidariedade e inclusão: ninguém deve se sentir sozinho<\/h2><\/div><p>Ninguém nasce dominando todas as habilidades do futebol. Conduzir a bola, melhorar um passe e compreender estratégias exige prática, paciência e orientação. Perseverar não significa ignorar a dor ou o cansaço.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Cada criança progride no seu ritmo. Os adultos devem valorizar os avanços sem comparações negativas.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Minha pequena meta semanal: escolher uma habilidade realista, praticá-la e conversar com o treinador sobre os avanços.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Perseverança: os erros também ensinam<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Família apoiando um jovem jogador · Ilustração conceitual para revisão; uniforme pendente de validação.<\/figcaption><\/figure><p>Compartilhar fotos sem autorização, espalhar boatos, insultar ou ridicularizar alguém contraria o respeito e a solidariedade. Antes de publicar, pense se o conteúdo pode machucar alguém ou se é necessário pedir permissão.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Semáforo digital: verde para elogiar com respeito; amarelo para parar e pedir autorização; vermelho para insultos, humilhações, dados privados ou conteúdos ofensivos.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade: analisar publicações fictícias e decidir juntos o que seria correto compartilhar.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>Os valores também se praticam nas redes sociais<\/h2><\/div><p>Os pais são exemplos de comportamento. Quando um adulto insulta o árbitro ou humilha um jogador, transmite uma mensagem contrária aos valores que queremos ensinar. Acompanhar significa apoiar, ouvir e reconhecer o esforço.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Cinco compromissos: incentivar sem insultar, reconhecer o esforço, dialogar com respeito, evitar comparações e lembrar que o futebol deve educar.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade: após o jogo, ouvir primeiro a criança antes de oferecer conselhos ou críticas.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>Os pais: apoiar sem pressionar<\/h2><\/div><p>O treinador influencia a técnica, a confiança e o comportamento dos jogadores. Corrigir sem humilhar, ouvir sem discriminar e estabelecer regras claras são responsabilidades essenciais.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Quando dois colegas discutem, o treinador pode ouvir ambos e ajudá-los a resolver o desacordo pelo diálogo.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>Atividade da equipe: combinar três regras de convivência e revisá-las periodicamente.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>O treinador: educar pelo exemplo<\/h2><\/div><p>Os valores ganham força quando se tornam ações. Estes dez compromissos podem ser lidos em família e discutidos nos treinos.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>Serei pontual e responsável.<\/label><label><input type=\"checkbox\"/>Respeitarei todos os meus colegas.<\/label><label><input type=\"checkbox\"/>Ouvirei meus treinadores.<\/label><label><input type=\"checkbox\"/>Jogarei com honestidade.<\/label><label><input type=\"checkbox\"/>Ajudarei quem precisar.<\/label><label><input type=\"checkbox\"/>Aceitarei meus erros e aprenderei com eles.<\/label><label><input type=\"checkbox\"/>Celebrarei as vitórias com humildade.<\/label><label><input type=\"checkbox\"/>Enfrentarei as derrotas com dignidade.<\/label><label><input type=\"checkbox\"/>Cuidarei dos meus estudos, da minha saúde e da minha família.<\/label><label><input type=\"checkbox\"/>Representarei com orgulho os valores do Barracuda F.C.<\/label><\/div><p class=\"meta\">Você pode marcar cada compromisso enquanto conversa em família.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Dez compromissos do jovem jogador Barracuda<\/h2><\/div><p>Em um jogo amistoso, o treinador observa não apenas as ações esportivas, mas também o respeito, o companheirismo, a honestidade e a solidariedade.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Ao final, cada jogador reconhece uma boa atitude de outro colega. Os pais também podem destacar comportamentos positivos.<\/div><\/div><div class=\"activity\"><strong>Para praticar em família<\/strong><div>O objetivo não é competir para ver quem é a melhor pessoa, mas reconhecer atitudes que fortalecem a convivência.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>Uma atividade especial: a partida dos valores<\/h2><\/div><p>Cada dia oferece uma oportunidade de praticar um valor diferente. A família pode preencher um pequeno calendário semanal e conversar sobre o que aprendeu.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span>Preparar os materiais esportivos e cumprir uma responsabilidade em casa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Ouvir outra pessoa sem interromper.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Ajudar alguém sem esperar recompensa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Reconhecer um erro e conversar sobre como corrigi-lo.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Fazer uma atividade em família com a colaboração de todos.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Praticar uma habilidade e reconhecer um avanço.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Agradecer a quem nos apoiou durante a semana.<\/span><\/label><\/div><\/div><p class=\"meta\">As marcações permanecem apenas enquanto esta página estiver aberta.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>O desafio familiar: sete dias praticando valores<\/h2><\/div><p>Desde nossa fundação, em 29 de abril de 2017, o Barracuda F.C. procura contribuir para o desenvolvimento esportivo e humano de crianças, adolescentes e jovens de nossa comunidade. Nossos valores institucionais — honestidade, transparência, disciplina, inclusão, respeito, solidariedade e excelência — orientam nossas atividades. Desejamos que cada jogador leve esses ensinamentos consigo, mesmo depois de encerrar sua trajetória esportiva.<\/p><div class=\"note\"><strong>Para refletir<\/strong><div>Um campeonato pode ser lembrado por anos, mas uma boa formação acompanha a pessoa por toda a vida.<\/div><\/div><\/section><div class=\"quote\">'Um troféu pode encher uma vitrine, mas os valores constroem uma vida.'<br/><span style=\"font-size:16px;font-weight:normal\">Que cada jogador seja reconhecido não apenas por seu talento, mas também por seu caráter.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Revista Digital · Artigo 6<\/small><\/footer>", "fr": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>MAGAZINE NUMÉRIQUE · DISCIPLINE · UNITÉ · GRANDEUR<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Article nº 6 · 18 novembre 2026<\/div><h1>Nous formons des champions pour <span>le football et pour la vie !<\/span><\/h1><p>Discipline, respect et valeurs qui forment de grands sportifs et de meilleures personnes.<\/p><div class=\"tags\"><span class=\"tag\">Formation humaine<\/span><span class=\"tag\">Familles<\/span><span class=\"tag\">Sport et valeurs<\/span><span class=\"tag\">Français<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Introduction<\/div><h2>Le véritable champion se construit sur le terrain et en dehors<\/h2><p>Chaque enfant qui rejoint Barracuda F.C. apporte un rêve. Certains veulent marquer le but décisif d'une finale, d'autres souhaitent représenter leur province et beaucoup imaginent devenir un jour footballeurs professionnels.<\/p><p>Mais derrière chaque rêve sportif se trouve une responsabilité encore plus importante : former des personnes honnêtes, disciplinées, respectueuses et solidaires. Le football offre des occasions extraordinaires d'apprendre à vivre ensemble, de surmonter les difficultés, de travailler en équipe et de comprendre que le succès ne se mesure pas toujours en trophées.<\/p><p>À Barracuda F.C., nous ne voulons pas seulement former de bons footballeurs. Nous voulons contribuer à former des personnes capables d'apporter un changement positif à leur famille et à leur communauté.<\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Équipe unie avant le match · Illustration conceptuelle pour examen ; tenue à valider.<\/figcaption><\/figure><details class=\"toc\"><summary>Explorer les 14 sections de l’article<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. Le véritable champion se construit sur le terrain et en dehors<\/a><a href=\"#s02\">02. Le football, une école de la vie<\/a><a href=\"#s03\">03. Discipline : de petites habitudes, de grands résultats<\/a><a href=\"#s04\">04. Respect : traiter les autres comme nous voulons être traités<\/a><a href=\"#s05\">05. Apprendre à gagner et aussi à perdre<\/a><a href=\"#s06\">06. Honnêteté et fair-play<\/a><a href=\"#s07\">07. Unité, solidarité et inclusion : personne ne doit se sentir seul<\/a><a href=\"#s08\">08. Persévérance : les erreurs nous apprennent aussi<\/a><a href=\"#s09\">09. Les valeurs se pratiquent aussi sur les réseaux sociaux<\/a><a href=\"#s10\">10. Les parents : accompagner sans mettre la pression<\/a><a href=\"#s11\">11. L’entraîneur : éduquer par l’exemple<\/a><a href=\"#s12\">12. Dix engagements du jeune footballeur Barracuda<\/a><a href=\"#s13\">13. Une activité spéciale : le match des valeurs<\/a><a href=\"#s14\">14. Le défi familial : sept jours pour pratiquer les valeurs<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>Le véritable champion se construit sur le terrain et en dehors<\/h2><\/div><p>Une équipe rassemble des enfants aux personnalités, capacités, expériences et situations familiales différentes. Partager cet espace est une première leçon du sport. Chaque joueur apprend à attendre son tour, écouter, respecter les règles et coopérer avec des camarades différents.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Un nouveau coéquipier a du mal à contrôler le ballon. Au lieu de se moquer de lui ou de l'exclure, nous pouvons l'encourager, l'aider et saluer ses progrès.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité familiale : après l'entraînement, demander « Qui as-tu aidé aujourd'hui ? » et « Qui t'a aidé ? »<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>Le football, une école de la vie<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Respect et salutations entre footballeurs · Illustration conceptuelle pour examen ; tenue à valider.<\/figcaption><\/figure><p>La discipline se construit au quotidien : arriver à l’heure, préparer sa tenue, faire ses devoirs et respecter ses engagements. Elle ne doit pas être confondue avec la peur ou la punition. Elle exige des règles claires, des explications adaptées et des conséquences proportionnées et respectueuses.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Si un enfant oublie son équipement, la famille peut l'aider à préparer son sac et lui confier progressivement cette responsabilité.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Défi de sept jours : préparer sa tenue, arriver à l'heure, faire ses devoirs, respecter le repos, aider à la maison, écouter l'entraîneur et corriger ses erreurs.<\/div><\/div><div class=\"checklist\"><strong>Coche les habitudes pratiquées cette semaine :<\/strong><label><input type=\"checkbox\"/>J'ai préparé ma tenue et mon équipement<\/label><label><input type=\"checkbox\"/>Je suis arrivé à l'heure<\/label><label><input type=\"checkbox\"/>J'ai fait mes devoirs<\/label><label><input type=\"checkbox\"/>J'ai respecté mes heures de repos<\/label><label><input type=\"checkbox\"/>J'ai aidé à la maison<\/label><label><input type=\"checkbox\"/>J'ai écouté l'entraîneur<\/label><label><input type=\"checkbox\"/>J'ai reconnu une erreur et cherché à la corriger<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Réinitialiser le défi<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>Discipline : de petites habitudes, de grands résultats<\/h2><\/div><p>Le respect ne dépend ni du résultat ni du niveau de jeu. Chaque joueur mérite d’être traité avec dignité. Respecter, c’est écouter, éviter les insultes, accepter les différences et comprendre que les erreurs font partie de l’apprentissage.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Trois situations : si quelqu'un rate un penalty, nous l'encourageons ; si nous contestons une décision arbitrale, nous parlons avec respect ; si un coéquipier joue différemment, nous l'incluons.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité : jouer ces situations à la maison et discuter des sentiments de chacun.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Respect : traiter les autres comme nous voulons être traités<\/h2><\/div><p>Gagner apporte de la joie ; perdre peut provoquer de la frustration. Ces deux expériences favorisent la maturité émotionnelle. Les parents doivent laisser leurs enfants exprimer leurs sentiments sans se moquer d’eux ni leur demander de les cacher.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Un enfant qui pleure après une défaite peut avoir besoin de compréhension, de temps et de soutien.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Trois questions après le match : Qu'as-tu aimé ? Qu'as-tu appris ? Que voudrais-tu améliorer ?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Apprendre à gagner et aussi à perdre<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Travail d’équipe et solidarité · Illustration conceptuelle pour examen ; tenue à valider.<\/figcaption><\/figure><p>L’honnêteté est une valeur fondamentale de Barracuda F.C. Un footballeur honnête respecte les règles, reconnaît ses erreurs et ne cherche pas à obtenir un avantage par la tromperie.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Si le ballon a touché notre pied avant de sortir, le reconnaître même si l'arbitre ne l'a pas vu est une preuve d'intégrité.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité familiale : se souvenir d'une situation où dire la vérité était difficile et discuter de ce qu'on en a appris.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Honnêteté et fair-play<\/h2><\/div><p>L’unité ne signifie pas penser tous de la même façon. Les différences n’empêchent pas de poursuivre un objectif commun. Une équipe solidaire aide chacun à se sentir intégré. L’inclusion implique de rejeter les moqueries et la discrimination.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Un petit geste peut changer la journée d'un coéquipier découragé.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Défi : faire une bonne action pour un coéquipier pendant la semaine sans attendre de récompense.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>Unité, solidarité et inclusion : personne ne doit se sentir seul<\/h2><\/div><p>Personne ne maîtrise toutes les techniques du football dès la naissance. Conduire le ballon, améliorer une passe et comprendre une tactique demandent de la pratique, de la patience et des conseils. Persévérer ne signifie pas ignorer la douleur ou la fatigue.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Chaque enfant progresse à son rythme. Les adultes doivent valoriser ses progrès sans comparaisons négatives.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Mon petit objectif de la semaine : choisir une compétence réaliste, la pratiquer et discuter des progrès avec l'entraîneur.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Persévérance : les erreurs nous apprennent aussi<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Famille soutenant un jeune footballeur · Illustration conceptuelle pour examen ; tenue à valider.<\/figcaption><\/figure><p>Partager des photos sans autorisation, répandre des rumeurs, insulter ou ridiculiser quelqu’un va à l’encontre du respect et de la solidarité. Avant de publier, demandons-nous si le contenu risque de blesser quelqu’un ou nécessite une permission.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Feu tricolore numérique : vert pour féliciter avec respect ; orange pour s'arrêter et demander la permission ; rouge pour les insultes, les humiliations, les données privées ou les contenus blessants.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité : examiner des exemples fictifs de publications et décider ensemble ce qu'il convient de partager.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>Les valeurs se pratiquent aussi sur les réseaux sociaux<\/h2><\/div><p>Les parents sont des modèles. Lorsqu’un adulte insulte l’arbitre ou humilie un joueur, il transmet un message contraire aux valeurs enseignées. Accompagner signifie soutenir, écouter et reconnaître les efforts.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Cinq engagements : encourager sans insulter, reconnaître les efforts, dialoguer avec respect, éviter les comparaisons et se rappeler que le football doit éduquer.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité : après le match, écouter d'abord l'enfant avant de lui donner des conseils ou de le critiquer.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>Les parents : accompagner sans mettre la pression<\/h2><\/div><p>L’entraîneur influence la technique, la confiance et le comportement de ses joueurs. Corriger sans humilier, écouter sans discriminer et fixer des règles claires sont des responsabilités essentielles.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>Lorsque deux coéquipiers se disputent, l'entraîneur peut écouter les deux et les aider à résoudre leur désaccord par le dialogue.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Activité d'équipe : convenir ensemble de trois règles de vie commune et les revoir régulièrement.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>L’entraîneur : éduquer par l’exemple<\/h2><\/div><p>Les valeurs prennent toute leur force lorsqu’elles deviennent des actions. Ces dix engagements peuvent être lus en famille et discutés à l’entraînement.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>Je serai ponctuel et responsable.<\/label><label><input type=\"checkbox\"/>Je respecterai tous mes coéquipiers.<\/label><label><input type=\"checkbox\"/>J'écouterai mes entraîneurs.<\/label><label><input type=\"checkbox\"/>Je jouerai honnêtement.<\/label><label><input type=\"checkbox\"/>J'aiderai ceux qui en ont besoin.<\/label><label><input type=\"checkbox\"/>J'accepterai mes erreurs et j'en tirerai des leçons.<\/label><label><input type=\"checkbox\"/>Je célébrerai les victoires avec humilité.<\/label><label><input type=\"checkbox\"/>J'affronterai les défaites avec dignité.<\/label><label><input type=\"checkbox\"/>Je prendrai soin de mes études, de ma santé et de ma famille.<\/label><label><input type=\"checkbox\"/>Je représenterai fièrement les valeurs de Barracuda F.C.<\/label><\/div><p class=\"meta\">Vous pouvez cocher chaque engagement en en discutant en famille.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Dix engagements du jeune footballeur Barracuda<\/h2><\/div><p>Lors d’un match amical, l’entraîneur observe non seulement le jeu, mais aussi les gestes de respect, d’entraide, d’honnêteté et de solidarité.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>À la fin, chaque joueur souligne une bonne action d'un autre coéquipier. Les parents peuvent également mettre en valeur les attitudes positives.<\/div><\/div><div class=\"activity\"><strong>À pratiquer en famille<\/strong><div>Le but n'est pas de rivaliser pour savoir qui est la meilleure personne, mais de reconnaître les comportements qui renforcent la vie collective.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>Une activité spéciale : le match des valeurs<\/h2><\/div><p>Chaque jour offre une occasion de pratiquer une valeur différente. La famille peut remplir un petit calendrier hebdomadaire et discuter des enseignements tirés.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span>Préparer son équipement sportif et assumer une responsabilité à la maison.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Écouter une autre personne sans l’interrompre.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Aider quelqu’un sans attendre de récompense.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Reconnaître une erreur et discuter de la manière de la corriger.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Faire une activité familiale à laquelle chacun participe.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Pratiquer une compétence et reconnaître un progrès.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Remercier les personnes qui nous ont soutenus pendant la semaine.<\/span><\/label><\/div><\/div><p class=\"meta\">Les cases cochées ne sont conservées que tant que cette page reste ouverte.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>Le défi familial : sept jours pour pratiquer les valeurs<\/h2><\/div><p>Depuis notre fondation, le 29 avril 2017, Barracuda F.C. cherche à contribuer au développement sportif et humain des enfants, adolescents et jeunes de notre communauté. Nos valeurs institutionnelles — honnêteté, transparence, discipline, inclusion, respect, solidarité et excellence — guident nos activités. Nous souhaitons que chaque joueur garde ces enseignements tout au long de sa vie, même après sa carrière sportive.<\/p><div class=\"note\"><strong>Pour réfléchir<\/strong><div>On peut se souvenir d'un championnat pendant des années, mais une bonne éducation accompagne une personne toute sa vie.<\/div><\/div><\/section><div class=\"quote\">« Un trophée peut remplir une vitrine, mais les valeurs construisent une vie. »<br/><span style=\"font-size:16px;font-weight:normal\">Que chaque joueur soit reconnu non seulement pour son talent, mais aussi pour ses qualités humaines.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Magazine numérique · Article 6<\/small><\/footer>", "de": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>DIGITALES MAGAZIN · DISZIPLIN · ZUSAMMENHALT · GRÖSSE<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Artikel Nr. 6 · 18. November 2026<\/div><h1>Wir bilden Champions für <span>den Fußball und fürs Leben!<\/span><\/h1><p>Disziplin, Respekt und Werte, die großartige Sportler und bessere Menschen formen.<\/p><div class=\"tags\"><span class=\"tag\">Persönlichkeitsbildung<\/span><span class=\"tag\">Familien<\/span><span class=\"tag\">Sport mit Werten<\/span><span class=\"tag\">Deutsch<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Einleitung<\/div><h2>Ein wahrer Champion wächst auf und neben dem Platz<\/h2><p>Jedes Kind, das zu Barracuda F.C. kommt, bringt einen Traum mit. Manche möchten das entscheidende Tor in einem Finale schießen, andere ihre Provinz vertreten, und viele stellen sich vor, eines Tages Profifußballer zu werden.<\/p><p>Doch hinter jedem sportlichen Traum steht eine noch wichtigere Verantwortung: ehrliche, disziplinierte, respektvolle und hilfsbereite Menschen heranzubilden. Fußball bietet großartige Möglichkeiten, das Zusammenleben zu lernen, Schwierigkeiten zu überwinden, im Team zu arbeiten und zu verstehen, dass Erfolg nicht immer an Pokalen gemessen wird.<\/p><p>Bei Barracuda F.C. wollen wir nicht nur gute Fußballer ausbilden. Wir möchten dazu beitragen, Menschen heranzubilden, die ihre Familien und Gemeinschaften positiv verändern können.<\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Teamzusammenhalt vor dem Spiel · Konzeptillustration zur Prüfung; Trikot noch nicht freigegeben.<\/figcaption><\/figure><details class=\"toc\"><summary>Die 14 Abschnitte des Artikels entdecken<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. Ein wahrer Champion wächst auf und neben dem Platz<\/a><a href=\"#s02\">02. Fußball als Schule fürs Leben<\/a><a href=\"#s03\">03. Disziplin: kleine Gewohnheiten, große Ergebnisse<\/a><a href=\"#s04\">04. Respekt: andere so behandeln, wie wir behandelt werden möchten<\/a><a href=\"#s05\">05. Lernen, zu gewinnen und zu verlieren<\/a><a href=\"#s06\">06. Ehrlichkeit und Fairplay<\/a><a href=\"#s07\">07. Zusammenhalt, Solidarität und Inklusion: Niemand soll allein sein<\/a><a href=\"#s08\">08. Ausdauer: Auch Fehler lehren uns<\/a><a href=\"#s09\">09. Werte gelten auch in sozialen Medien<\/a><a href=\"#s10\">10. Eltern: unterstützen statt Druck auszuüben<\/a><a href=\"#s11\">11. Trainer: durch Vorbild erziehen<\/a><a href=\"#s12\">12. Zehn Versprechen eines jungen Barracuda-Fußballers<\/a><a href=\"#s13\">13. Eine besondere Aktivität: das Spiel der Werte<\/a><a href=\"#s14\">14. Die Familienaufgabe: sieben Tage gelebte Werte<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>Ein wahrer Champion wächst auf und neben dem Platz<\/h2><\/div><p>In einem Team treffen Kinder mit unterschiedlichen Persönlichkeiten, Fähigkeiten, Erfahrungen und familiären Hintergründen zusammen. Diesen Raum zu teilen ist eine der ersten Lehren des Sports. Man lernt zu warten, zuzuhören, Regeln einzuhalten und mit andersdenkenden Mitspielern zusammenzuarbeiten.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Ein neuer Mitspieler hat Schwierigkeiten, den Ball zu kontrollieren. Statt ihn auszulachen oder auszuschließen, können wir ihn ermutigen, unterstützen und seine Fortschritte würdigen.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Familienaufgabe: Nach dem Training fragen: „Wem hast du heute geholfen?“ und „Wer hat dir geholfen?“<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>Fußball als Schule fürs Leben<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Respekt und Begrüßung unter Fußballern · Konzeptillustration zur Prüfung; Trikot noch nicht freigegeben.<\/figcaption><\/figure><p>Disziplin entsteht durch alltägliche Handlungen: pünktlich sein, die Ausrüstung vorbereiten, Hausaufgaben erledigen und Zusagen einhalten. Sie darf nicht mit Angst oder Strafe verwechselt werden. Es braucht klare Regeln, verständliche Erklärungen und angemessene, respektvolle Konsequenzen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Wenn ein Kind seine Ausrüstung vergisst, kann die Familie beim Packen der Tasche helfen und ihm diese Verantwortung schrittweise übertragen.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Sieben-Tage-Aufgabe: Trikot vorbereiten, pünktlich kommen, Schulaufgaben erledigen, Ruhezeiten einhalten, zu Hause helfen, dem Trainer zuhören und Fehler korrigieren.<\/div><\/div><div class=\"checklist\"><strong>Markiere die Gewohnheiten, die du diese Woche geübt hast:<\/strong><label><input type=\"checkbox\"/>Ich habe Trikot und Ausrüstung vorbereitet<\/label><label><input type=\"checkbox\"/>Ich war pünktlich<\/label><label><input type=\"checkbox\"/>Ich habe meine Schulaufgaben erledigt<\/label><label><input type=\"checkbox\"/>Ich habe meine Ruhezeiten eingehalten<\/label><label><input type=\"checkbox\"/>Ich habe zu Hause geholfen<\/label><label><input type=\"checkbox\"/>Ich habe dem Trainer zugehört<\/label><label><input type=\"checkbox\"/>Ich habe einen Fehler eingestanden und versucht, ihn zu korrigieren<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Aufgabe zurücksetzen<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>Disziplin: kleine Gewohnheiten, große Ergebnisse<\/h2><\/div><p>Respekt hängt weder vom Ergebnis noch vom Können ab. Jeder Spieler verdient Würde. Respekt heißt zuhören, Beleidigungen vermeiden, Unterschiede akzeptieren und Fehler als Teil des Lernens verstehen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Drei Situationen: Verschießt jemand einen Elfmeter, machen wir Mut; sind wir mit dem Schiedsrichter nicht einverstanden, sprechen wir respektvoll; spielt ein Mitspieler anders, beziehen wir ihn ein.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Aufgabe: Diese Situationen zu Hause nachspielen und darüber sprechen, wie sich alle Beteiligten fühlen.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Respekt: andere so behandeln, wie wir behandelt werden möchten<\/h2><\/div><p>Gewinnen macht Freude; Verlieren kann frustrieren. Beides fördert emotionale Reife. Eltern sollten ihren Kindern erlauben, Gefühle zu zeigen, ohne sie auszulachen oder zum Verbergen ihrer Emotionen zu drängen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Ein Kind, das nach einer Niederlage weint, braucht vielleicht Verständnis, Zeit und Begleitung.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Drei Fragen nach dem Spiel: Was hat dir Freude gemacht? Was hast du gelernt? Was möchtest du verbessern?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Lernen, zu gewinnen und zu verlieren<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Teamarbeit und Solidarität · Konzeptillustration zur Prüfung; Trikot noch nicht freigegeben.<\/figcaption><\/figure><p>Ehrlichkeit ist einer der Grundwerte von Barracuda F.C. Ein ehrlicher Fußballer hält sich an die Regeln, gesteht Fehler ein und versucht nicht, durch Täuschung Vorteile zu erlangen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Wenn der Ball vor dem Aus unser Bein berührt hat, zeigt es Integrität, dies zuzugeben, auch wenn der Schiedsrichter es nicht gesehen hat.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Familienaufgabe: An eine Situation denken, in der es schwer war, die Wahrheit zu sagen, und über das Gelernte sprechen.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Ehrlichkeit und Fairplay<\/h2><\/div><p>Zusammenhalt bedeutet nicht, dass alle gleich denken. Unterschiede stehen einem gemeinsamen Ziel nicht im Weg. Ein solidarisches Team hilft seinen Mitgliedern und sorgt dafür, dass sich alle zugehörig fühlen. Inklusion verlangt, Spott und Diskriminierung abzulehnen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Eine kleine Geste kann den Tag eines entmutigten Mitspielers verändern.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Aufgabe: Im Laufe der Woche einem Mitspieler etwas Gutes tun, ohne eine Gegenleistung zu erwarten.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>Zusammenhalt, Solidarität und Inklusion: Niemand soll allein sein<\/h2><\/div><p>Niemand beherrscht von Geburt an alle Fuß
