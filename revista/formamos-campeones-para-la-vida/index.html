balltechniken. Dribbeln, Passen und Taktikverständnis brauchen Übung, Geduld und Anleitung. Durchhaltevermögen bedeutet nicht, Schmerzen oder Erschöpfung zu ignorieren.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Jedes Kind entwickelt sich in seinem eigenen Tempo. Erwachsene sollten Fortschritte ohne negative Vergleiche würdigen.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Mein kleines Wochenziel: eine realistische Fähigkeit auswählen, üben und die Fortschritte mit dem Trainer besprechen.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Ausdauer: Auch Fehler lehren uns<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Familie unterstützt einen jungen Fußballer · Konzeptillustration zur Prüfung; Trikot noch nicht freigegeben.<\/figcaption><\/figure><p>Fotos ohne Erlaubnis teilen, Gerüchte verbreiten, beleidigen oder jemanden verspotten widerspricht Respekt und Solidarität. Vor jeder Veröffentlichung sollten wir überlegen, ob Inhalte jemanden verletzen oder eine Einwilligung erfordern.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Digitale Ampel: Grün für respektvolle Glückwünsche; Gelb für Innehalten und um Erlaubnis fragen; Rot für Beleidigungen, Demütigungen, private Daten und verletzende Inhalte.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Aufgabe: Erfundenen Beiträgen in sozialen Medien ansehen und gemeinsam entscheiden, was man teilen sollte.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>Werte gelten auch in sozialen Medien<\/h2><\/div><p>Eltern sind Vorbilder. Wenn Erwachsene Schiedsrichter beleidigen oder Spieler demütigen, vermitteln sie das Gegenteil unserer Werte. Begleiten bedeutet unterstützen, zuhören und Anstrengung anerkennen.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Fünf Vorsätze: ohne Beleidigungen ermutigen, Einsatz anerkennen, respektvoll sprechen, Vergleiche vermeiden und daran denken, dass Fußball auch erziehen soll.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Aufgabe: Nach dem Spiel zuerst dem Kind zuhören, bevor man Ratschläge gibt oder Kritik äußert.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>Eltern: unterstützen statt Druck auszuüben<\/h2><\/div><p>Trainer prägen Technik, Selbstvertrauen und Verhalten ihrer Spieler. Ohne Demütigung korrigieren, ohne Diskriminierung zuhören und klare Regeln setzen sind wesentliche Aufgaben.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Wenn zwei Mitspieler streiten, kann der Trainer beiden zuhören und ihnen helfen, den Konflikt im Gespräch zu lösen.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Teamaufgabe: Gemeinsam drei Regeln für das Miteinander vereinbaren und regelmäßig überprüfen.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>Trainer: durch Vorbild erziehen<\/h2><\/div><p>Werte werden stark, wenn sie im Alltag gelebt werden. Diese zehn Versprechen können Familien gemeinsam lesen und im Training besprechen.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>Ich werde pünktlich und verantwortungsbewusst sein.<\/label><label><input type=\"checkbox\"/>Ich werde alle Mitspieler respektieren.<\/label><label><input type=\"checkbox\"/>Ich werde meinen Trainern zuhören.<\/label><label><input type=\"checkbox\"/>Ich werde ehrlich spielen.<\/label><label><input type=\"checkbox\"/>Ich werde Menschen helfen, die Unterstützung brauchen.<\/label><label><input type=\"checkbox\"/>Ich werde meine Fehler akzeptieren und daraus lernen.<\/label><label><input type=\"checkbox\"/>Ich werde Siege bescheiden feiern.<\/label><label><input type=\"checkbox\"/>Ich werde Niederlagen mit Würde annehmen.<\/label><label><input type=\"checkbox\"/>Ich werde auf meine Schule, Gesundheit und Familie achten.<\/label><label><input type=\"checkbox\"/>Ich werde die Werte von Barracuda F.C. mit Stolz vertreten.<\/label><\/div><p class=\"meta\">Ihr könnt jeden Vorsatz beim Gespräch in der Familie abhaken.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Zehn Versprechen eines jungen Barracuda-Fußballers<\/h2><\/div><p>Bei einem Freundschaftsspiel achtet der Trainer nicht nur auf die sportliche Leistung, sondern auch auf Respekt, Teamgeist, Ehrlichkeit und Solidarität.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>Am Ende würdigt jeder Spieler eine gute Tat eines Mitspielers. Auch die Eltern können positive Haltungen hervorheben.<\/div><\/div><div class=\"activity\"><strong>Für die Familie<\/strong><div>Es geht nicht darum, wer der bessere Mensch ist, sondern darum, Verhalten anzuerkennen, das das Miteinander stärkt.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>Eine besondere Aktivität: das Spiel der Werte<\/h2><\/div><p>Jeder Tag bietet eine Gelegenheit, einen anderen Wert zu üben. Familien können einen kleinen Wochenkalender ausfüllen und über das Gelernte sprechen.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span>Sportausrüstung vorbereiten und eine Aufgabe zu Hause übernehmen.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Einem anderen Menschen zuhören, ohne ihn zu unterbrechen.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Jemandem helfen, ohne eine Gegenleistung zu erwarten.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Einen Fehler zugeben und besprechen, wie man ihn korrigieren kann.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Etwas als Familie unternehmen, wobei alle mithelfen.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Eine Fähigkeit üben und einen Fortschritt erkennen.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Den Menschen danken, die uns in dieser Woche unterstützt haben.<\/span><\/label><\/div><\/div><p class=\"meta\">Die Markierungen bleiben nur erhalten, solange diese Seite geöffnet ist.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>Die Familienaufgabe: sieben Tage gelebte Werte<\/h2><\/div><p>Seit unserer Gründung am 29. April 2017 setzt sich Barracuda F.C. für die sportliche und persönliche Entwicklung von Kindern, Jugendlichen und jungen Erwachsenen unserer Gemeinschaft ein. Unsere Vereinswerte — Ehrlichkeit, Transparenz, Disziplin, Inklusion, Respekt, Solidarität und Exzellenz — leiten unser Handeln. Wir hoffen, dass jeder Spieler diese Lehren sein Leben lang mitnimmt, auch nach dem Ende seiner sportlichen Laufbahn.<\/p><div class=\"note\"><strong>Zum Nachdenken<\/strong><div>An eine Meisterschaft erinnert man sich vielleicht jahrelang, doch eine gute Erziehung begleitet einen Menschen sein Leben lang.<\/div><\/div><\/section><div class=\"quote\">„Ein Pokal kann eine Vitrine füllen, doch Werte gestalten ein Leben.“<br/><span style=\"font-size:16px;font-weight:normal\">Möge jeder Spieler nicht nur für sein Talent, sondern auch für seinen Charakter Anerkennung finden.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Digitales Magazin · Artikel 6<\/small><\/footer>", "it": "<header class=\"top\"><img alt=\"Escudo oficial de Barracuda F.C.\" src=\"__img0__\"/><div><b>BARRACUDA F.C.<\/b><small>RIVISTA DIGITALE · DISCIPLINA · UNITÀ · GRANDEZZA<\/small><\/div><\/header><section class=\"hero\"><div class=\"wrap\"><div class=\"kicker\">Articolo n. 6 · 18 novembre 2026<\/div><h1>Formiamo campioni per <span>il calcio e per la vita!<\/span><\/h1><p>Disciplina, rispetto e valori che formano grandi atleti e persone migliori.<\/p><div class=\"tags\"><span class=\"tag\">Formazione umana<\/span><span class=\"tag\">Famiglie<\/span><span class=\"tag\">Sport e valori<\/span><span class=\"tag\">Italiano<\/span><\/div><\/div><\/section><main class=\"main\"><div class=\"intro\"><div class=\"kicker\" style=\"color:#8e1a3c\">Introduzione<\/div><h2>Il vero campione cresce dentro e fuori dal campo<\/h2><p>Ogni bambino che arriva al Barracuda F.C. porta con sé un sogno. Alcuni vogliono segnare il gol decisivo in una finale, altri desiderano rappresentare la propria provincia e molti immaginano di diventare un giorno calciatori professionisti.<\/p><p>Ma dietro ogni sogno sportivo c'è una responsabilità ancora più importante: formare persone oneste, disciplinate, rispettose e solidali. Il calcio offre straordinarie occasioni per imparare a convivere, superare le difficoltà, lavorare in squadra e capire che il successo non si misura sempre in trofei.<\/p><p>Al Barracuda F.C. non vogliamo formare soltanto buoni calciatori. Vogliamo contribuire a formare persone capaci di migliorare la vita delle loro famiglie e comunità.<\/p><\/div><figure class=\"editorial-photo\"><img alt=\"Equipo unido antes del partido\" loading=\"lazy\" src=\"__img1__\"/><figcaption>Squadra unita prima della partita · Illustrazione concettuale per revisione; divisa da approvare.<\/figcaption><\/figure><details class=\"toc\"><summary>Esplora le 14 sezioni dell’articolo<\/summary><div class=\"toc-grid\"><a href=\"#s01\">01. Il vero campione cresce dentro e fuori dal campo<\/a><a href=\"#s02\">02. Il calcio come scuola di vita<\/a><a href=\"#s03\">03. Disciplina: piccole abitudini, grandi risultati<\/a><a href=\"#s04\">04. Rispetto: trattare gli altri come vorremmo essere trattati<\/a><a href=\"#s05\">05. Imparare a vincere e anche a perdere<\/a><a href=\"#s06\">06. Onestà e fair play<\/a><a href=\"#s07\">07. Unione, solidarietà e inclusione: nessuno deve sentirsi solo<\/a><a href=\"#s08\">08. Perseveranza: anche gli errori insegnano<\/a><a href=\"#s09\">09. I valori contano anche sui social media<\/a><a href=\"#s10\">10. I genitori: accompagnare senza fare pressione<\/a><a href=\"#s11\">11. L’allenatore: educare con l’esempio<\/a><a href=\"#s12\">12. Dieci impegni del giovane calciatore Barracuda<\/a><a href=\"#s13\">13. Un’attività speciale: la partita dei valori<\/a><a href=\"#s14\">14. La sfida in famiglia: sette giorni di valori<\/a><\/div><\/details><section class=\"section\" id=\"s01\"><div class=\"sec-head\"><span class=\"number\">01<\/span><h2>Il vero campione cresce dentro e fuori dal campo<\/h2><\/div><p>Una squadra riunisce bambini con personalità, abilità, esperienze e situazioni familiari differenti. Condividere questo spazio è una delle prime lezioni dello sport. Ogni giocatore impara ad aspettare il proprio turno, ascoltare, rispettare le regole e collaborare con compagni diversi.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Un nuovo compagno fatica a controllare il pallone. Invece di deriderlo o escluderlo, possiamo incoraggiarlo, aiutarlo e apprezzare i suoi progressi.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività in famiglia: dopo l'allenamento, chiedere 'Chi hai aiutato oggi?' e 'Chi ti ha aiutato?'<\/div><\/div><\/section><section class=\"section\" id=\"s02\"><div class=\"sec-head\"><span class=\"number\">02<\/span><h2>Il calcio come scuola di vita<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Respeto y saludo entre futbolistas\" loading=\"lazy\" src=\"__img2__\"/><figcaption>Rispetto e saluti tra calciatori · Illustrazione concettuale per revisione; divisa da approvare.<\/figcaption><\/figure><p>La disciplina nasce dai gesti quotidiani: arrivare puntuali, preparare la divisa, svolgere i compiti scolastici e rispettare gli impegni. Non va confusa con la paura o la punizione. Richiede regole chiare, spiegazioni adeguate e conseguenze proporzionate e rispettose.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Se un bambino dimentica l'attrezzatura, la famiglia può aiutarlo a preparare la borsa e affidargli gradualmente questa responsabilità.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Sfida di sette giorni: preparare la divisa, arrivare puntuali, fare i compiti, rispettare il riposo, aiutare in casa, ascoltare l'allenatore e correggere gli errori.<\/div><\/div><div class=\"checklist\"><strong>Segna le abitudini praticate questa settimana:<\/strong><label><input type=\"checkbox\"/>Ho preparato divisa e attrezzatura<\/label><label><input type=\"checkbox\"/>Sono arrivato puntuale<\/label><label><input type=\"checkbox\"/>Ho fatto i compiti scolastici<\/label><label><input type=\"checkbox\"/>Ho rispettato gli orari di riposo<\/label><label><input type=\"checkbox\"/>Ho aiutato in casa<\/label><label><input type=\"checkbox\"/>Ho ascoltato l'allenatore<\/label><label><input type=\"checkbox\"/>Ho riconosciuto un errore e cercato di correggerlo<\/label><\/div><button class=\"btn\" onclick=\"this.parentNode.querySelectorAll('input[type=checkbox]').forEach(x=&gt;x.checked=false)\">Ricomincia la sfida<\/button><\/section><section class=\"section\" id=\"s03\"><div class=\"sec-head\"><span class=\"number\">03<\/span><h2>Disciplina: piccole abitudini, grandi risultati<\/h2><\/div><p>Il rispetto non dipende dal risultato né dalle capacità. Tutti i giocatori meritano dignità. Rispettare significa ascoltare, evitare insulti, accettare le differenze e riconoscere che gli errori fanno parte dell’apprendimento.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Tre situazioni: se qualcuno sbaglia un rigore, lo incoraggiamo; se non siamo d'accordo con l'arbitro, parliamo con rispetto; se un compagno gioca diversamente, lo includiamo.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività: rappresentare queste situazioni in casa e parlare di come si sente ogni persona.<\/div><\/div><\/section><section class=\"section\" id=\"s04\"><div class=\"sec-head\"><span class=\"number\">04<\/span><h2>Rispetto: trattare gli altri come vorremmo essere trattati<\/h2><\/div><p>Vincere porta gioia; perdere può causare frustrazione. Entrambe le esperienze sviluppano maturità emotiva. I genitori devono lasciare che i figli esprimano ciò che provano senza deriderli o pretendere che nascondano le emozioni.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Un bambino che piange dopo una sconfitta può avere bisogno di comprensione, tempo e sostegno.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Tre domande dopo la partita: Che cosa ti è piaciuto? Che cosa hai imparato? Che cosa vorresti migliorare?<\/div><\/div><\/section><section class=\"section\" id=\"s05\"><div class=\"sec-head\"><span class=\"number\">05<\/span><h2>Imparare a vincere e anche a perdere<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Trabajo en equipo y solidaridad\" loading=\"lazy\" src=\"__img3__\"/><figcaption>Lavoro di squadra e solidarietà · Illustrazione concettuale per revisione; divisa da approvare.<\/figcaption><\/figure><p>L’onestà è uno dei valori fondamentali del Barracuda F.C. Un calciatore onesto rispetta le regole, riconosce i propri errori e non cerca vantaggi attraverso l’inganno.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Se il pallone ha toccato il nostro piede prima di uscire, ammetterlo anche quando l'arbitro non l'ha visto dimostra integrità.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività in famiglia: ricordare un'occasione in cui dire la verità è stato difficile e parlare di ciò che si è imparato.<\/div><\/div><\/section><section class=\"section\" id=\"s06\"><div class=\"sec-head\"><span class=\"number\">06<\/span><h2>Onestà e fair play<\/h2><\/div><p>Unione non significa pensarla tutti allo stesso modo. Le differenze non impediscono di perseguire un obiettivo comune. Una squadra solidale aiuta i propri membri e fa sentire tutti parte del gruppo. L’inclusione richiede di rifiutare prese in giro e discriminazioni.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Un piccolo gesto può cambiare la giornata di un compagno scoraggiato.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Sfida: fare una buona azione per un compagno durante la settimana, senza aspettarsi nulla in cambio.<\/div><\/div><\/section><section class=\"section\" id=\"s07\"><div class=\"sec-head\"><span class=\"number\">07<\/span><h2>Unione, solidarietà e inclusione: nessuno deve sentirsi solo<\/h2><\/div><p>Nessuno nasce sapendo già tutte le abilità calcistiche. Dribbling, passaggi e tattica richiedono pratica, pazienza e guida. Perseverare non significa ignorare il dolore o la stanchezza.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Ogni bambino progredisce con i propri tempi. Gli adulti devono valorizzare i miglioramenti senza paragoni negativi.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Il mio piccolo obiettivo settimanale: scegliere un'abilità realistica, esercitarsi e parlare dei progressi con l'allenatore.<\/div><\/div><\/section><section class=\"section\" id=\"s08\"><div class=\"sec-head\"><span class=\"number\">08<\/span><h2>Perseveranza: anche gli errori insegnano<\/h2><\/div><figure class=\"editorial-photo\"><img alt=\"Familia acompañando a un joven futbolista\" loading=\"lazy\" src=\"__img4__\"/><figcaption>Famiglia che sostiene un giovane calciatore · Illustrazione concettuale per revisione; divisa da approvare.<\/figcaption><\/figure><p>Condividere foto senza autorizzazione, diffondere voci, insultare o ridicolizzare qualcuno contraddice rispetto e solidarietà. Prima di pubblicare, pensiamo se il contenuto può ferire qualcuno o se serve un permesso.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Semaforo digitale: verde per congratularsi con rispetto; giallo per fermarsi e chiedere il permesso; rosso per insulti, umiliazioni, dati privati o contenuti offensivi.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività: esaminare esempi immaginari di post e decidere insieme che cosa è opportuno condividere.<\/div><\/div><\/section><section class=\"section\" id=\"s09\"><div class=\"sec-head\"><span class=\"number\">09<\/span><h2>I valori contano anche sui social media<\/h2><\/div><p>I genitori sono modelli di comportamento. Quando un adulto insulta l’arbitro o umilia un giocatore, trasmette un messaggio contrario ai nostri valori. Accompagnare significa sostenere, ascoltare e riconoscere l’impegno.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Cinque impegni: incoraggiare senza insultare, riconoscere l'impegno, dialogare con rispetto, evitare paragoni e ricordare che il calcio deve educare.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività: dopo la partita, ascoltare prima il bambino, poi offrire consigli o critiche.<\/div><\/div><\/section><section class=\"section\" id=\"s10\"><div class=\"sec-head\"><span class=\"number\">10<\/span><h2>I genitori: accompagnare senza fare pressione<\/h2><\/div><p>L’allenatore influenza tecnica, fiducia e comportamento dei giocatori. Correggere senza umiliare, ascoltare senza discriminare e stabilire regole chiare sono responsabilità fondamentali.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Quando due compagni litigano, l'allenatore può ascoltarli entrambi e aiutarli a risolvere il disaccordo con il dialogo.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Attività per la squadra: concordare tre regole di convivenza e rivederle periodicamente.<\/div><\/div><\/section><section class=\"section\" id=\"s11\"><div class=\"sec-head\"><span class=\"number\">11<\/span><h2>L’allenatore: educare con l’esempio<\/h2><\/div><p>I valori diventano più forti quando si trasformano in azioni. Questi dieci impegni possono essere letti in famiglia e discussi durante gli allenamenti.<\/p><div class=\"checklist\"><label><input type=\"checkbox\"/>Sarò puntuale e responsabile.<\/label><label><input type=\"checkbox\"/>Rispetterò tutti i miei compagni.<\/label><label><input type=\"checkbox\"/>Ascolterò i miei allenatori.<\/label><label><input type=\"checkbox\"/>Giocherò con onestà.<\/label><label><input type=\"checkbox\"/>Aiuterò chi ne ha bisogno.<\/label><label><input type=\"checkbox\"/>Accetterò i miei errori e imparerò da essi.<\/label><label><input type=\"checkbox\"/>Festeggerò le vittorie con umiltà.<\/label><label><input type=\"checkbox\"/>Affronterò le sconfitte con dignità.<\/label><label><input type=\"checkbox\"/>Mi prenderò cura dei miei studi, della salute e della famiglia.<\/label><label><input type=\"checkbox\"/>Rappresenterò con orgoglio i valori del Barracuda F.C.<\/label><\/div><p class=\"meta\">Puoi spuntare ogni impegno mentre ne parli in famiglia.<\/p><\/section><section class=\"section\" id=\"s12\"><div class=\"sec-head\"><span class=\"number\">12<\/span><h2>Dieci impegni del giovane calciatore Barracuda<\/h2><\/div><p>Durante un’amichevole, l’allenatore osserva non solo le azioni sportive, ma anche il rispetto, il gioco di squadra, l’onestà e la solidarietà.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Alla fine ogni giocatore riconosce una buona azione di un compagno. Anche i genitori possono valorizzare gli atteggiamenti positivi.<\/div><\/div><div class=\"activity\"><strong>Da praticare in famiglia<\/strong><div>Lo scopo non è competere per stabilire chi sia la persona migliore, ma riconoscere i comportamenti che rafforzano la convivenza.<\/div><\/div><\/section><section class=\"section\" id=\"s13\"><div class=\"sec-head\"><span class=\"number\">13<\/span><h2>Un’attività speciale: la partita dei valori<\/h2><\/div><p>Ogni giorno offre l’opportunità di praticare un valore diverso. La famiglia può compilare un piccolo calendario settimanale e parlare di ciò che ha imparato.<\/p><div class=\"days\"><div class=\"day\"><label><input type=\"checkbox\"/><span>Preparare l’attrezzatura sportiva e svolgere una responsabilità in casa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Ascoltare un’altra persona senza interromperla.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Aiutare qualcuno senza aspettarsi una ricompensa.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Riconoscere un errore e parlare di come correggerlo.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Svolgere un’attività familiare in cui tutti collaborano.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Esercitare un’abilità e riconoscere un miglioramento.<\/span><\/label><\/div><div class=\"day\"><label><input type=\"checkbox\"/><span>Ringraziare chi ci ha sostenuto durante la settimana.<\/span><\/label><\/div><\/div><p class=\"meta\">Le selezioni restano solo finché questa pagina rimane aperta.<\/p><\/section><section class=\"section\" id=\"s14\"><div class=\"sec-head\"><span class=\"number\">14<\/span><h2>La sfida in famiglia: sette giorni di valori<\/h2><\/div><p>Dalla nostra fondazione, il 29 aprile 2017, il Barracuda F.C. cerca di contribuire allo sviluppo sportivo e umano di bambini, adolescenti e giovani della nostra comunità. I nostri valori istituzionali — onestà, trasparenza, disciplina, inclusione, rispetto, solidarietà ed eccellenza — guidano le nostre attività. Ci auguriamo che ogni giocatore porti con sé questi insegnamenti per tutta la vita, anche dopo la fine del suo percorso sportivo.<\/p><div class=\"note\"><strong>Per riflettere<\/strong><div>Un campionato può essere ricordato per anni, ma una buona formazione accompagna una persona per tutta la vita.<\/div><\/div><\/section><div class=\"quote\">'Un trofeo può riempire una vetrina, ma i valori costruiscono una vita.'<br/><span style=\"font-size:16px;font-weight:normal\">Che ogni giocatore sia riconosciuto non solo per il talento, ma anche per le qualità umane.<\/span><\/div><\/main><footer class=\"footer\"><img alt=\"Escudo oficial\" src=\"__img0__\"/><strong>BARRACUDA F.C.<\/strong><p>DISCIPLINA · UNIÓN · GRANDEZA<\/p><small>Rivista digitale · Articolo 6<\/small><\/footer>"};

function displayArticle(lang){
  const root=document.getElementById('article-content');

  chooser.value=lang;document.documentElement.lang=lang;
  const heading=root.querySelector('h1');if(heading)document.title=heading.textContent.trim()+' · Barracuda F.C.';
  history.replaceState(null,'','#'+lang);
}
chooser.addEventListener('change',()=>displayArticle(chooser.value));
