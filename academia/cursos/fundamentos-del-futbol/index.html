<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundamentos del fútbol | Academia Barracuda F.C.</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#32222b;background:#faf8f5}*{box-sizing:border-box}body{margin:0}header{background:#59172f;color:#fff;padding:20px max(20px,calc((100% - 1060px)/2));display:flex;align-items:center;gap:16px}header img{width:66px;height:66px;object-fit:contain;background:white;border-radius:10px}header small{display:block;color:#f2d59a;margin-top:5px}main{max-width:1060px;margin:auto;padding:30px 20px 65px}a{color:#6b1d3b}h1,h2{color:#59172f}h1{font-size:clamp(1.7rem,4vw,2.8rem)}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}select{font:inherit;padding:11px;border:1px solid #ad9aa3;border-radius:8px;background:white}.grid{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:24px}.card{background:#fff;border:1px solid #e5d9dd;border-radius:14px;padding:23px;box-shadow:0 4px 15px #2814200a}.module{width:100%;text-align:left;display:block;margin:8px 0;padding:15px;border:1px solid #dfd4d8;border-radius:9px;background:#fff;color:#542039;cursor:pointer;font:inherit}.module.active{background:#601c3a;color:#fff;border-color:#601c3a}.tag{color:#9d722c;font-weight:700}.notice{border-left:4px solid #c89c46;background:#fff7e7;padding:14px;margin-top:24px}p{line-height:1.75}.section{margin-top:25px}.section h3{color:#59172f}.time{font-size:.9rem;color:#655761}footer{text-align:center;background:#341024;color:#fff;padding:25px}@media(max-width:720px){.grid{grid-template-columns:1fr}}header{border-bottom:4px solid #c99d47}header img{background:transparent;border-radius:0;width:76px;height:76px}.card{border-top:3px solid #d0a44d}.course-hero{margin-top:18px;background:linear-gradient(115deg,#4c102b,#7c2446 64%,#b78b3c);border-radius:16px;padding:28px;color:white;display:flex;align-items:center;gap:24px;overflow:hidden}.course-hero img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 9px #200a15)}.course-hero strong{font-size:clamp(1.35rem,3vw,2rem);display:block}.course-hero span{display:block;margin-top:8px;color:#f5e3b6}.photo-note{background:#fff8e9;border-left:4px solid #bb923b;padding:12px 16px;margin:14px 0;font-size:.9rem}@media(max-width:600px){.course-hero{padding:18px}.course-hero img{width:76px;height:76px}}</style></head><body><header><img src="/assets/escudo-oficial.jpg" alt="Barracuda F.C."><div><strong>BARRACUDA F.C. · ACADEMIA VIRTUAL</strong><small>DISCIPLINA · UNIÓN · GRANDEZA</small></div></header><main><div class="bar"><a href="/academia/" id="back">← Volver a la academia</a><label><span aria-label="Idioma">🌐</span> <select id="lang" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></label></div><div class="course-hero"><img src="/assets/escudo-oficial.jpg" alt="Escudo oficial Barracuda F.C."><div><strong>ACADEMIA VIRTUAL · BARRACUDA F.C.</strong><span>DISCIPLINA · UNIÓN · GRANDEZA</span></div></div><h1 id="title"></h1><p id="tag" class="tag"></p><p id="duration" class="time"></p><div class="grid"><nav class="card" id="nav" aria-label="Módulos"></nav><article class="card" id="content"></article></div><section class="card" id="exam-preview" style="margin-top:22px;border-top:4px solid #c89c46"><h2 id="exam-title"></h2><p id="exam-meta"></p><p class="notice" id="exam-warning"></p><button id="exam-toggle" type="button" style="padding:12px 18px;background:#59172f;color:white;border:0;border-radius:8px;cursor:pointer"></button><div id="exam-questions" hidden></div></section><p class="notice" id="note"></p></main><footer>© Barracuda F.C. · DISCIPLINA · UNIÓN · GRANDEZA</footer><script>const languages={"es":{"name":"Español","title":"Fundamentos del fútbol","tag":"Aprende fútbol. Crece con valores.","objectives":"Objetivo","lesson":"Lección","practice":"Actividad práctica","hours":"horas","back":"Volver a la academia","note":"Material de estudio en revisión institucional. Inscripciones y certificados aún no habilitados.","modules":[["El fútbol, sus valores y sus reglas básicas","Comprender el fútbol como deporte colectivo y practicarlo con respeto, disciplina y honestidad.","El fútbol enfrenta a dos equipos que intentan marcar goles. Se juega respetando las reglas, a los árbitros, compañeros y rivales. El juego limpio exige aceptar decisiones, evitar la violencia y ayudar a quienes lo necesitan. La disciplina se demuestra llegando puntualmente, escuchando al entrenador y cumpliendo compromisos.","Describe tres ejemplos de juego limpio y explica cómo actuarías si un compañero comete un error."],["Técnica individual: control, pase y conducción","Reconocer y practicar las bases del dominio del balón.","El control permite recibir el balón y prepararlo para la siguiente acción. El pase conecta a los compañeros: observa antes de pasar, orienta el cuerpo y ajusta la fuerza. La conducción consiste en avanzar con toques cortos y la mirada alternando entre balón y entorno. Practica con ambos pies y prioriza la precisión antes de la velocidad.","Realiza diez pases contra una pared, diez controles orientados y una conducción en zigzag entre conos, en un espacio seguro."],["Principios tácticos y trabajo en equipo","Comprender las decisiones colectivas básicas en ataque y defensa.","En ataque, los jugadores deben ofrecer líneas de pase, ocupar espacios libres y apoyarse mutuamente. En defensa, deben proteger la portería, recuperar posiciones y comunicarse. No todos deben correr hacia el balón: la distribución del equipo facilita mejores decisiones. Escuchar, avisar y cooperar mejora el rendimiento colectivo.","Dibuja una situación de tres atacantes frente a dos defensores e indica dos opciones de pase y una cobertura defensiva."],["Reglas esenciales y hábitos de formación","Identificar reglas frecuentes y hábitos para entrenar con seguridad.","Los saques de banda, de esquina y de meta reanudan el juego según cómo salió el balón. Las faltas se sancionan para proteger la seguridad y la justicia deportiva. El fuera de juego requiere considerar la posición y participación del atacante en el momento del pase. Antes de entrenar, realiza un calentamiento progresivo; mantente hidratado, descansa y avisa si sientes dolor.","Explica cinco situaciones de juego y prepara una lista personal de hidratación, calentamiento, descanso y cuidado del equipo."]]},"en":{"name":"English","title":"Football Fundamentals","tag":"Learn football. Grow with values.","objectives":"Objective","lesson":"Lesson","practice":"Practical activity","hours":"hours","back":"Back to academy","note":"Study material under institutional review. Enrollment and certificates are not yet available.","modules":[["Football, its values and basic rules","Understand football as a team sport and practice it with respect, discipline and honesty.","Football is played by two teams trying to score goals. Players must respect the rules, referees, teammates and opponents. Fair play means accepting decisions, avoiding violence and helping others. Discipline includes arriving on time, listening to coaches and honoring commitments.","Describe three examples of fair play and explain how you would respond when a teammate makes a mistake."],["Individual technique: control, passing and dribbling","Recognize and practice basic ball skills.","First touch helps receive the ball and prepare the next action. Passing connects teammates: look up, position your body and adjust the force. Dribbling means moving with controlled touches while checking both the ball and the surroundings. Practice with both feet, prioritizing accuracy before speed.","Make ten wall passes, ten directional first touches and dribble in a zigzag around cones in a safe area."],["Tactical principles and teamwork","Understand basic team decisions in attack and defense.","In attack, players create passing options, find open space and support one another. In defense, they protect the goal, recover their positions and communicate. Everyone chasing the ball leaves dangerous gaps; balanced positioning supports better decisions. Listening and cooperating improve the whole team.","Draw a three-versus-two attacking situation and identify two passing options and one defensive cover."],["Essential rules and training habits","Identify common rules and safe training habits.","Throw-ins, corner kicks and goal kicks restart play according to how the ball leaves the field. Fouls protect fairness and safety. Offside depends on an attacker's position and involvement when the ball is played by a teammate. Warm up progressively, drink water, rest and tell an adult or coach if you feel pain.","Explain five match situations and prepare a checklist for hydration, warm-up, rest and equipment care."]]},"pt":{"name":"Português","title":"Fundamentos do Futebol","tag":"Aprenda futebol. Cresça com valores.","objectives":"Objetivo","lesson":"Lição","practice":"Atividade prática","hours":"horas","back":"Voltar à academia","note":"Material em revisão institucional. Inscrições e certificados ainda não estão disponíveis.","modules":[["O futebol, seus valores e regras básicas","Compreender o futebol como esporte coletivo, com respeito, disciplina e honestidade.","O futebol reúne duas equipes que tentam marcar gols. É essencial respeitar as regras, os árbitros, os colegas e os adversários. O jogo limpo significa aceitar decisões, evitar a violência e ajudar os outros. A disciplina inclui pontualidade, atenção ao treinador e compromisso.","Descreva três exemplos de jogo limpo e explique como reagiria ao erro de um colega."],["Técnica individual: domínio, passe e condução","Reconhecer e praticar habilidades básicas com a bola.","O domínio permite receber a bola e preparar a próxima jogada. O passe conecta colegas: observe antes de passar, posicione o corpo e controle a força. A condução exige toques curtos e atenção ao espaço. Pratique com os dois pés, priorizando a precisão.","Faça dez passes contra uma parede, dez domínios orientados e conduza a bola em zigue-zague entre cones, em local seguro."],["Princípios táticos e trabalho em equipe","Compreender decisões coletivas básicas no ataque e na defesa.","No ataque, ofereça opções de passe, ocupe espaços livres e apoie colegas. Na defesa, proteja o gol, recupere posições e comunique-se. Todos correrem atrás da bola cria espaços perigosos. A organização e a cooperação melhoram as decisões.","Desenhe uma situação de três atacantes contra dois defensores e indique dois passes e uma cobertura."],["Regras essenciais e hábitos de formação","Identificar regras frequentes e hábitos seguros.","Laterais, escanteios e tiros de meta reiniciam o jogo conforme a saída da bola. As faltas protegem a segurança e a justiça. O impedimento depende da posição e participação do atacante no momento do passe. Aqueça gradualmente, hidrate-se, descanse e comunique dores.","Explique cinco situações de jogo e crie uma lista de hidratação, aquecimento, descanso e cuidados com o material."]]},"fr":{"name":"Français","title":"Les fondamentaux du football","tag":"Apprenez le football. Grandissez avec des valeurs.","objectives":"Objectif","lesson":"Leçon","practice":"Activité pratique","hours":"heures","back":"Retour à l’académie","note":"Contenu en cours de validation institutionnelle. Inscriptions et certificats indisponibles pour le moment.","modules":[["Le football, ses valeurs et ses règles de base","Comprendre le football collectif et le pratiquer avec respect, discipline et honnêteté.","Deux équipes cherchent à marquer des buts. Les joueurs respectent les règles, les arbitres, leurs partenaires et leurs adversaires. Le fair-play implique d'accepter les décisions, d'éviter la violence et d'aider les autres. La discipline comprend la ponctualité, l'écoute et l'engagement.","Donnez trois exemples de fair-play et expliquez votre réaction face à l'erreur d'un partenaire."],["Technique individuelle : contrôle, passe et conduite","Reconnaître et pratiquer les gestes fondamentaux avec le ballon.","Le contrôle permet de recevoir le ballon et de préparer la suite. La passe relie les partenaires : levez la tête, orientez le corps et dosez la force. La conduite consiste à avancer par petites touches en observant l'environnement. Travaillez les deux pieds et privilégiez la précision.","Effectuez dix passes contre un mur, dix contrôles orientés et un slalom entre des plots dans un espace sûr."],["Principes tactiques et esprit d'équipe","Comprendre les choix collectifs de base en attaque et en défense.","En attaque, proposez des solutions de passe, occupez les espaces libres et soutenez vos partenaires. En défense, protégez le but, replacez-vous et communiquez. Courir tous vers le ballon crée des espaces dangereux. L'organisation et l'entraide améliorent les décisions.","Dessinez une situation de trois attaquants face à deux défenseurs : proposez deux passes et une couverture."],["Règles essentielles et habitudes d'entraînement","Identifier les règles courantes et les habitudes de sécurité.","Les touches, corners et sorties de but relancent le jeu selon la sortie du ballon. Les fautes protègent l'équité et la sécurité. Le hors-jeu dépend de la position et de la participation de l'attaquant lors de la passe. Échauffez-vous progressivement, hydratez-vous, reposez-vous et signalez toute douleur.","Expliquez cinq situations de match et créez une liste pour l'hydratation, l'échauffement, le repos et le matériel."]]},"de":{"name":"Deutsch","title":"Grundlagen des Fußballs","tag":"Fußball lernen. Mit Werten wachsen.","objectives":"Lernziel","lesson":"Lektion","practice":"Praktische Übung","hours":"Stunden","back":"Zurück zur Akademie","note":"Lernmaterial wird institutionell geprüft. Anmeldung und Zertifikate sind noch nicht verfügbar.","modules":[["Fußball, Werte und Grundregeln","Fußball als Mannschaftssport verstehen und mit Respekt, Disziplin und Ehrlichkeit spielen.","Zwei Mannschaften versuchen, Tore zu erzielen. Regeln, Schiedsrichter, Mitspieler und Gegner müssen respektiert werden. Fairplay bedeutet, Entscheidungen zu akzeptieren, Gewalt zu vermeiden und anderen zu helfen. Disziplin zeigt sich in Pünktlichkeit, Zuhören und Zuverlässigkeit.","Nenne drei Beispiele für Fairplay und erkläre, wie du auf einen Fehler eines Mitspielers reagieren würdest."],["Individualtechnik: Ballannahme, Pass und Dribbling","Grundlegende Fertigkeiten am Ball erkennen und üben.","Die Ballannahme bereitet die nächste Aktion vor. Pässe verbinden Mitspieler: vor dem Pass aufblicken, den Körper ausrichten und die Kraft dosieren. Beim Dribbling wird der Ball mit kurzen Kontakten geführt, während die Umgebung beobachtet wird. Beide Füße trainieren; Genauigkeit geht vor Tempo.","Spiele zehn Pässe gegen eine Wand, übe zehn gezielte Ballannahmen und dribble im Slalom um Hütchen an einem sicheren Ort."],["Taktische Grundsätze und Teamarbeit","Einfache gemeinsame Entscheidungen in Angriff und Abwehr verstehen.","Im Angriff bieten Spieler Passwege an, nutzen freie Räume und unterstützen sich. In der Abwehr schützen sie das Tor, nehmen Positionen wieder ein und sprechen miteinander. Wenn alle zum Ball laufen, entstehen Lücken. Gute Raumaufteilung und Zusammenarbeit erleichtern Entscheidungen.","Zeichne eine Drei-gegen-zwei-Situation und markiere zwei Passmöglichkeiten und eine defensive Absicherung."],["Wichtige Regeln und Trainingsgewohnheiten","Häufige Regeln und sichere Trainingsgewohnheiten kennen.","Einwurf, Eckstoß und Abstoß setzen das Spiel nach dem Ausball fort. Fouls werden zum Schutz von Fairness und Sicherheit geahndet. Abseits hängt von Position und Beteiligung des Angreifers beim Zuspiel ab. Wärme dich schrittweise auf, trinke Wasser, erhole dich und melde Schmerzen.","Erkläre fünf Spielsituationen und erstelle eine Liste für Trinken, Aufwärmen, Erholung und Ausrüstung."]]},"it":{"name":"Italiano","title":"Fondamenti del calcio","tag":"Impara il calcio. Cresci con i valori.","objectives":"Obiettivo","lesson":"Lezione","practice":"Attività pratica","hours":"ore","back":"Torna all’accademia","note":"Materiale in revisione istituzionale. Iscrizioni e certificati non ancora disponibili.","modules":[["Il calcio, i suoi valori e le regole di base","Comprendere il calcio come sport di squadra e praticarlo con rispetto, disciplina e onestà.","Due squadre cercano di segnare gol. Bisogna rispettare le regole, gli arbitri, i compagni e gli avversari. Il fair play significa accettare le decisioni, evitare la violenza e aiutare gli altri. La disciplina comprende puntualità, ascolto e impegno.","Descrivi tre esempi di fair play e spiega come reagiresti all'errore di un compagno."],["Tecnica individuale: controllo, passaggio e conduzione","Riconoscere e praticare le abilità fondamentali con il pallone.","Il controllo permette di ricevere il pallone e preparare l'azione successiva. Il passaggio collega i compagni: osserva prima, orienta il corpo e dosa la forza. La conduzione richiede tocchi brevi e attenzione allo spazio. Allenati con entrambi i piedi, privilegiando la precisione.","Esegui dieci passaggi contro un muro, dieci controlli orientati e uno slalom tra coni in un luogo sicuro."],["Principi tattici e lavoro di squadra","Comprendere le decisioni collettive di base in attacco e in difesa.","In attacco, offri linee di passaggio, occupa gli spazi liberi e sostieni i compagni. In difesa, proteggi la porta, recupera la posizione e comunica. Correre tutti verso il pallone lascia spazi pericolosi. Organizzazione e collaborazione migliorano le scelte.","Disegna una situazione di tre attaccanti contro due difensori e indica due passaggi e una copertura."],["Regole essenziali e abitudini di allenamento","Identificare le regole comuni e le abitudini per allenarsi in sicurezza.","Rimesse laterali, calci d'angolo e rinvii dal fondo riprendono il gioco in base all'uscita del pallone. I falli tutelano sicurezza e correttezza. Il fuorigioco dipende dalla posizione e dalla partecipazione dell'attaccante al momento del passaggio. Riscaldati gradualmente, idratati, riposa e segnala eventuali dolori.","Spiega cinque situazioni di gioco e crea una lista per idratazione, riscaldamento, riposo e cura dell'attrezzatura."]]}};const duration=[2,3,3,2];const $=id=>document.getElementById(id);let lang=new URLSearchParams(location.search).get('lang')||'es',moduleIndex=0;if(!languages[lang])lang='es';const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const d=languages[lang];document.documentElement.lang=lang;$('lang').value=lang;$('title').textContent=d.title;$('tag').textContent=d.tag;$('back').textContent='← '+d.back;$('duration').textContent='10 '+d.hours+' · 4 módulos';$('note').textContent=d.note;$('nav').innerHTML=d.modules.map((m,i)=>'<button class="module '+(i===moduleIndex?'active':'')+'" data-index="'+i+'">'+(i+1)+'. '+escapeHTML(m[0])+' <small>('+duration[i]+' '+escapeHTML(d.hours)+')</small></button>').join('');const m=d.modules[moduleIndex];$('content').innerHTML='<div class="tag">'+(moduleIndex+1)+' / 4</div><h2>'+escapeHTML(m[0])+'</h2><div class="section"><h3>'+escapeHTML(d.objectives)+'</h3><p>'+escapeHTML(m[1])+'</p></div><div class="section"><h3>'+escapeHTML(d.lesson)+'</h3><p>'+escapeHTML(m[2])+'</p></div><div class="section"><h3>'+escapeHTML(d.practice)+'</h3><p>'+escapeHTML(m[3])+'</p></div>';$('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{moduleIndex=Number(b.dataset.index);render();window.scrollTo({top:0,behavior:'smooth'});}));} $('lang').addEventListener('change',e=>{lang=e.target.value;history.replaceState(null,'','?lang='+lang);render();});render();</script><style>.lessonlink{display:block;width:100%;text-align:left;border:1px solid #eadfe3;background:#fff;color:#52203a;padding:9px 12px;margin:5px 0;border-radius:7px;cursor:pointer;font:inherit}.lessonlink.active{background:#f7e8ed;border-color:#641c39;font-weight:700}.lessonlink.done:before{content:'✓ ';color:#087047}.lesson-section{border-top:1px solid #eee;padding-top:13px;margin-top:17px}.lesson-section h3{color:#59172f}.lesson-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.lesson-actions button{border:0;border-radius:8px;padding:12px;background:#601c3a;color:white;cursor:pointer}.lesson-actions button.secondary{background:#f0e9ec;color:#59172f}.lesson-actions button:disabled{opacity:.45}.progress{height:9px;background:#e8dde2;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#b38a37;transition:width .2s}</style><script>const extra={"lessons":[[["¿Qué es el fútbol?","What is football?","O que é futebol?","Qu'est-ce que le football ?","Was ist Fußball?","Che cos'è il calcio?"],["El terreno y los participantes","The pitch and participants","O campo e os participantes","Le terrain et les participants","Spielfeld und Beteiligte","Il campo e i partecipanti"],["Respeto y juego limpio","Respect and fair play","Respeito e jogo limpo","Respect et fair-play","Respekt und Fairplay","Rispetto e fair play"],["Disciplina y responsabilidad","Discipline and responsibility","Disciplina e responsabilidade","Discipline et responsabilité","Disziplin und Verantwortung","Disciplina e responsabilità"],["Comunicación y compañerismo","Communication and team spirit","Comunicação e companheirismo","Communication et esprit d'équipe","Kommunikation und Teamgeist","Comunicazione e spirito di squadra"]],[["Postura y equilibrio","Posture and balance","Postura e equilíbrio","Posture et équilibre","Haltung und Gleichgewicht","Postura ed equilibrio"],["Primer toque y control","First touch and control","Primeiro toque e domínio","Premier toucher et contrôle","Erster Kontakt und Ballannahme","Primo tocco e controllo"],["Pase y recepción","Passing and receiving","Passe e recepção","Passe et réception","Passen und Annehmen","Passaggio e ricezione"],["Conducción y cambios de dirección","Dribbling and direction changes","Condução e mudanças de direção","Conduite et changements de direction","Dribbling und Richtungswechsel","Conduzione e cambi di direzione"],["Regate y protección del balón","Feints and shielding the ball","Fintas e proteção da bola","Feintes et protection du ballon","Finten und Ballabschirmung","Finte e protezione della palla"]],[["Ocupar espacios","Using space","Ocupar espaços","Occuper les espaces","Räume nutzen","Occupare gli spazi"],["Desmarque y apoyo","Off-ball movement and support","Desmarcação e apoio","Démarquage et soutien","Freilaufen und Unterstützung","Smarrcamento e sostegno"],["Defender en equipo","Defending together","Defender em equipe","Défendre ensemble","Gemeinsam verteidigen","Difendere insieme"],["Transición ataque-defensa","Attack-to-defense transition","Transição ataque-defesa","Transition attaque-défense","Umschalten von Angriff auf Abwehr","Transizione attacco-difesa"],["Decisiones y liderazgo","Decision-making and leadership","Decisões e liderança","Décisions et leadership","Entscheidungen und Führung","Decisioni e leadership"]],[["Reanudaciones del juego","Restarts of play","Reinícios do jogo","Reprises du jeu","Spielfortsetzungen","Riprese del gioco"],["Faltas y seguridad","Fouls and safety","Faltas e segurança","Fautes et sécurité","Fouls und Sicherheit","Falli e sicurezza"],["Introducción al fuera de juego","Introduction to offside","Introdução ao impedimento","Introduction au hors-jeu","Einführung ins Abseits","Introduzione al fuorigioco"],["Calentamiento e hidratación","Warm-up and hydration","Aquecimento e hidratação","Échauffement et hydratation","Aufwärmen und Trinken","Riscaldamento e idratazione"],["Descanso y hábitos saludables","Rest and healthy habits","Descanso e hábitos saudáveis","Repos et bonnes habitudes","Erholung und gesunde Gewohnheiten","Riposo e abitudini sane"]]],"focus":[["Identifica el objetivo de marcar goles sin olvidar las reglas.","Identify the aim of scoring while following the rules.","Identifique o objetivo de marcar gols respeitando as regras.","Identifiez l'objectif de marquer tout en respectant les règles.","Erkenne das Ziel, Tore regelgerecht zu erzielen.","Riconosci l'obiettivo di segnare rispettando le regole."],["Distingue líneas, porterías, compañeros, rivales y árbitro.","Distinguish lines, goals, teammates, opponents and referee.","Distinga linhas, gols, colegas, adversários e árbitro.","Distinguez lignes, buts, partenaires, adversaires et arbitre.","Unterscheide Linien, Tore, Mitspieler, Gegner und Schiedsrichter.","Distingui linee, porte, compagni, avversari e arbitro."],["Aprende a aceptar decisiones y ayudar a otros jugadores.","Learn to accept decisions and help other players.","Aprenda a aceitar decisões e ajudar outros jogadores.","Apprenez à accepter les décisions et à aider les autres.","Lerne Entscheidungen anzunehmen und anderen zu helfen.","Impara ad accettare le decisioni e aiutare gli altri."],["Practica puntualidad, preparación y responsabilidad personal.","Practice punctuality, preparation and personal responsibility.","Pratique pontualidade, preparação e responsabilidade.","Pratiquez ponctualité, préparation et responsabilité.","Übe Pünktlichkeit, Vorbereitung und Verantwortung.","Pratica puntualità, preparazione e responsabilità."],["Comunica con claridad, escucha y anima a tus compañeros.","Communicate clearly, listen and encourage teammates.","Comunique-se com clareza, escute e incentive colegas.","Communiquez clairement, écoutez et encouragez l'équipe.","Sprich klar, höre zu und ermutige Mitspieler.","Comunica con chiarezza, ascolta e incoraggia i compagni."],["Flexiona ligeramente las rodillas y mantén estabilidad al moverte.","Bend your knees slightly and stay balanced while moving.","Flexione levemente os joelhos e mantenha o equilíbrio.","Fléchissez légèrement les genoux et gardez l'équilibre.","Beuge die Knie leicht und halte beim Bewegen das Gleichgewicht.","Piega leggermente le ginocchia e mantieni l'equilibrio."],["Amortigua el balón y oriéntalo hacia el siguiente movimiento.","Cushion the ball and direct it toward the next action.","Amorteça a bola e direcione-a para a próxima ação.","Amortissez le ballon et orientez-le vers l'action suivante.","Dämpfe den Ball und lenke ihn zur nächsten Aktion.","Attutisci la palla e orientala verso l'azione successiva."],["Mira antes de pasar, usa el interior del pie y ajusta la fuerza.","Look before passing, use the inside of the foot and adjust force.","Olhe antes de passar, use a parte interna do pé e dose a força.","Regardez avant la passe, utilisez l'intérieur du pied et dosez la force.","Schau vor dem Pass, nutze die Fußinnenseite und dosiere die Kraft.","Guarda prima del passaggio, usa l'interno del piede e dosa la forza."],["Conduce con toques cortos, cambia de ritmo y observa el entorno.","Use short touches, change pace and scan your surroundings.","Conduza com toques curtos, mude o ritmo e observe o entorno.","Avancez par petites touches, changez de rythme et observez.","Führe den Ball eng, wechsle das Tempo und beobachte deine Umgebung.","Conduci con tocchi brevi, cambia ritmo e osserva intorno."],["Usa el cuerpo sin empujar para proteger el balón y crear espacio.","Use your body without pushing to shield the ball and make space.","Use o corpo sem empurrar para proteger a bola e criar espaço.","Protégez le ballon avec le corps sans pousser et créez de l'espace.","Schirme den Ball ohne Schubsen ab und schaffe Raum.","Proteggi la palla col corpo senza spingere e crea spazio."],["Busca espacios libres y evita que todos corran hacia el balón.","Find open spaces instead of everyone chasing the ball.","Procure espaços livres em vez de todos correrem para a bola.","Cherchez les espaces libres sans tous courir vers le ballon.","Suche freie Räume, statt dass alle zum Ball laufen.","Cerca spazi liberi invece di correre tutti verso la palla."],["Muévete para ofrecer una opción segura de pase al compañero.","Move to offer a safe passing option to a teammate.","Mova-se para oferecer uma opção segura de passe.","Déplacez-vous pour offrir une solution de passe sûre.","Bewege dich, um eine sichere Passoption anzubieten.","Muoviti per offrire una soluzione di passaggio sicura."],["Protege la portería, mantén distancias y ayuda a quien presiona.","Protect the goal, keep spacing and support the pressing player.","Proteja o gol, mantenha distâncias e ajude quem pressiona.","Protégez le but, gardez les distances et soutenez le pressing.","Schütze das Tor, halte Abstände und unterstütze den Druck.","Proteggi la porta, mantieni le distanze e aiuta chi pressa."],["Al perder el balón, reacciona, comunícate y recupera posiciones.","When possession is lost, react, communicate and recover shape.","Ao perder a bola, reaja, comunique-se e recupere posições.","À la perte du ballon, réagissez, communiquez et replacez-vous.","Nach Ballverlust reagieren, sprechen und Positionen zurückgewinnen.","Alla perdita della palla, reagisci, comunica e riprendi posizione."],["Observa opciones, decide con calma y respeta al equipo.","Scan options, decide calmly and respect the team.","Observe opções, decida com calma e respeite a equipe.","Observez les options, décidez calmement et respectez l'équipe.","Prüfe Optionen, entscheide ruhig und respektiere das Team.","Osserva le opzioni, decidi con calma e rispetta la squadra."],["Reconoce cuándo corresponde saque de banda, esquina o meta.","Recognize when a throw-in, corner or goal kick is awarded.","Reconheça quando há lateral, escanteio ou tiro de meta.","Reconnaissez touche, corner et sortie de but.","Erkenne Einwurf, Eckstoß und Abstoß.","Riconosci rimessa laterale, calcio d'angolo e rinvio dal fondo."],["Diferencia contacto permitido de acciones peligrosas o imprudentes.","Distinguish legal contact from careless or dangerous actions.","Diferencie contato permitido de ações imprudentes ou perigosas.","Distinguez contact autorisé et gestes imprudents ou dangereux.","Unterscheide erlaubten Kontakt von gefährlichen Aktionen.","Distingui il contatto lecito dalle azioni imprudenti o pericolose."],["Comprende que estar adelantado no siempre implica infracción.","Understand that being ahead does not always mean an offense.","Entenda que estar adiantado nem sempre é infração.","Comprenez qu'être avancé n'est pas toujours une infraction.","Verstehe, dass eine Abseitsposition nicht immer strafbar ist.","Comprendi che essere avanti non significa sempre infrazione."],["Prepara músculos y articulaciones gradualmente y bebe agua.","Warm up muscles and joints gradually and drink water.","Aqueça músculos e articulações gradualmente e beba água.","Échauffez progressivement muscles et articulations et buvez.","Wärme Muskeln und Gelenke langsam auf und trinke Wasser.","Riscalda gradualmente muscoli e articolazioni e bevi acqua."],["Duerme lo suficiente, aliméntate bien y comunica molestias.","Sleep enough, eat well and report discomfort.","Durma o suficiente, alimente-se bem e comunique dores.","Dormez suffisamment, mangez bien et signalez les douleurs.","Schlafe genug, ernähre dich gut und melde Beschwerden.","Dormi abbastanza, mangia bene e segnala i dolori."]],"ui":{"es":["Módulo","Lección","Idea clave","Explicación","Ejemplo de aplicación","Ejercicio","Autoevaluación","¿Puedes explicar con tus palabras el objetivo y realizar la actividad con seguridad?","Sí, comprendí","Necesito repasar","Lección anterior","Siguiente lección","Lecciones","Progreso local de lectura","Esta marca de lectura se guarda únicamente en este navegador. No acredita horas, calificaciones ni aprobación.","Lecciones de estudio en revisión. El examen, las matrículas y los certificados no están habilitados."],"en":["Module","Lesson","Key idea","Explanation","Application exampl ocument.getElementById('exam-toggle').addEventListener('click',()=>{examOpen=!examOpen;drawExam()});document.getElementById('lang').addEventListener('change',drawExam);drawExam();</script></body></html>
