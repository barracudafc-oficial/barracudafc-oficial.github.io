atio:12/7;object-fit:cover;border-radius:13px;box-shadow:0 12px 28px #29152b20}.quote{background:#f9efd9;border-left:5px solid var(--oro);padding:25px;margin:35px 0;font:italic 1.4rem/1.4 Georgia,serif;color:#67162c}.sources{background:#f7f3ed;border-radius:12px;padding:25px;margin-top:30px}.sources h2{font-size:1.35rem}.sources p{font-size:.94rem}.sources a{overflow-wrap:anywhere}footer{background:#51112a;color:white;text-align:center;padding:30px 20px;border-top:5px solid var(--oro)}footer img{width:70px;display:block;margin:0 auto 10px}footer small{display:block;color:#f3c973}@media(max-width:740px){.hero{padding:65px 20px}.section{grid-template-columns:1fr;gap:20px}.section:nth-child(even) .copy,.section:nth-child(even) .visual{order:initial}.controls{width:100%;justify-content:space-between}}</style></head><body><header><a class="brand" href="index.html"><img src="assets/escudo-oficial.jpg" alt="Escudo oficial Barracuda F.C.">BARRACUDA F.C.</a><div class="controls"><a id="back" href="noticias.html">Volver a la revista</a><select id="lang" aria-label="Idioma"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option></select></div></header><section class="hero"><div><span class="eyebrow">BARRACUDA F.C. · REVISTA DIGITAL · SALUD Y DEPORTE</span><h1 id="title"></h1><p id="deck"></p></div></section><div class="meta">22 de octubre de 2026 · Dr. H. C. Xavier Gavilanes · Salinas, Ecuador</div><main class="article" id="article"></main><footer><img src="assets/escudo-oficial.jpg" alt="Barracuda F.C."><strong>BARRACUDA F.C.</strong><small>DISCIPLINA · UNIÓN · GRANDEZA</small><span>www.barracudafc.com</span></footer><script>const translations={"es":{"title":"El deporte y la salud: una inversión en la vida y el futuro de nuestra sociedad","deck":"La actividad física fortalece el cuerpo, favorece el bienestar emocional y contribuye a construir comunidades más saludables.","heads":["Mucho más que una actividad física","El deporte como aliado de la salud física","La salud mental también se fortalece con el deporte","Infancia y adolescencia: etapas fundamentales","Familia, educación y comunidad","Barracuda F.C.: nuestro compromiso","Una inversión para el futuro"],"paras":["El deporte trasciende los resultados y los campeonatos. En una sociedad marcada por el sedentarismo y el tiempo frente a las pantallas, mantenernos activos es una decisión que beneficia nuestra calidad de vida. Caminar, bailar, nadar, montar bicicleta y jugar fútbol son distintas formas de incorporar movimiento a la rutina.","La actividad física regular ayuda a proteger la salud cardiovascular, fortalecer músculos y huesos y disminuir el riesgo de enfermedades no transmisibles. La Organización Mundial de la Salud recomienda para los adultos entre 150 y 300 minutos semanales de actividad aeróbica moderada, o entre 75 y 150 minutos de actividad vigorosa, además de fortalecimiento muscular al menos dos días por semana.","La actividad física también puede mejorar el sueño, la autoestima y los síntomas de ansiedad y depresión. En los deportes colectivos, compartir esfuerzos, superar dificultades y celebrar logros fomenta vínculos y sentido de pertenencia. El deporte complementa, pero no sustituye, la atención profesional de salud mental cuando es necesaria.","Durante la infancia y la adolescencia, el movimiento favorece el desarrollo motor, la salud ósea y el bienestar psicológico. Para las edades de 5 a 17 años, la OMS recomienda un promedio de 60 minutos diarios de actividad moderada a vigorosa a lo largo de la semana. La formación deportiva debe priorizar el disfrute, la seguridad y el desarrollo integral, no únicamente la competencia.","Las familias y las instituciones educativas tienen un papel decisivo: facilitar espacios seguros, fomentar el juego al aire libre y enseñar hábitos de alimentación, hidratación y descanso. En Santa Elena, ampliar las oportunidades de actividad física puede fortalecer la convivencia y el bienestar de personas de todas las edades.","En Barracuda Fútbol Club creemos que la práctica deportiva debe acompañarse de educación, disciplina, respeto y cuidado de la salud. Aspiramos a promover una formación que considere la preparación física, la prevención de lesiones y el bienestar emocional, sin colocar los resultados deportivos por encima de la integridad de las personas.","Una sociedad saludable también se construye mediante prevención, educación y espacios accesibles para mantenerse activa. Cada persona que descubre el valor del movimiento representa una oportunidad para mejorar su presente. Invertir en deporte es invertir en salud, educación y futuro."],"sources":"Fuentes y orientación","note":"Artículo informativo. Las actividades deben adaptarse a la edad, capacidades y condición de salud de cada persona; no reemplaza el consejo médico.","back":"Volver a la revista","share":"Compartir"},"en":{"title":"Sport and health: investing in life and our society's future","deck":"Physical activity strengthens the body, supports emotional well-being and helps build healthier communities.","heads":["More than physical activity","Sport supports physical health","Mental health benefits from movement","Childhood and adolescence matter","Families, education and community","Our commitment at Barracuda F.C.","Investing in the future"],"paras":["Sport is about more than winning competitions. In a world of prolonged sitting and screen time, being active can improve quality of life. Walking, dancing, swimming, cycling and playing football all count.","Regular physical activity supports cardiovascular health, muscles and bones and helps reduce the risk of noncommunicable diseases. WHO recommends that adults aim for 150–300 minutes of moderate aerobic activity or 75–150 minutes of vigorous activity each week, plus muscle-strengthening activities on at least two days.","Movement can improve sleep and self-esteem and ease symptoms of anxiety and depression. Team sports also create connections and a sense of belonging. Sport complements, but does not replace, professional mental health care when needed.","For children and adolescents, activity supports motor development, bone health and psychological well-being. WHO recommends an average of 60 minutes of moderate-to-vigorous physical activity daily across the week for ages 5–17. Enjoyment, safety and personal growth should come before results.","Families and schools can encourage outdoor play, safe spaces, healthy food, hydration and rest. In Santa Elena, wider access to sport can support community ties and well-being across generations.","Barracuda F.C. believes sport should go hand in hand with education, discipline, respect and health. Our vision values physical preparation, injury prevention and emotional well-being, always placing people above results.","Healthier communities are built through prevention, education and opportunities to be active. Every person who discovers the value of movement is a step towards a better future. Investing in sport means investing in health, education and the future."],"sources":"Sources and guidance","note":"For information only. Activity should suit each person's age, abilities and health; this does not replace medical advice.","back":"Back to the magazine","share":"Share"},"pt":{"title":"Esporte e saúde: um investimento na vida e no futuro da sociedade","deck":"A atividade física fortalece o corpo, favorece o bem-estar emocional e ajuda a construir comunidades mais saudáveis.","heads":["Muito mais do que atividade física","O esporte como aliado da saúde física","A saúde mental também se fortalece","Infância e adolescência: etapas essenciais","Família, educação e comunidade","O compromisso do Barracuda F.C.","Um investimento no futuro"],"paras":["O esporte vai além de vitórias e campeonatos. Diante do sedentarismo e do tempo diante das telas, manter-se ativo melhora a qualidade de vida. Caminhar, dançar, nadar, pedalar e jogar futebol são formas de se movimentar.","A atividade física regular favorece a saúde cardiovascular, fortalece músculos e ossos e reduz o risco de doenças não transmissíveis. A OMS recomenda aos adultos de 150 a 300 minutos semanais de atividade moderada, ou de 75 a 150 minutos de atividade vigorosa, além de fortalecimento muscular em pelo menos dois dias.","O movimento pode melhorar o sono, a autoestima e os sintomas de ansiedade e depressão. Esportes coletivos fortalecem vínculos e o sentimento de pertencimento. A prática esportiva complementa, mas não substitui, o atendimento especializado quando necessário.","Na infância e adolescência, a atividade física contribui para o desenvolvimento motor, a saúde óssea e o bem-estar psicológico. Para pessoas de 5 a 17 anos, a OMS recomenda uma média de 60 minutos diários de atividade moderada a vigorosa ao longo da semana. Segurança e desenvolvimento devem vir antes dos resultados.","Famílias e escolas podem estimular brincadeiras ao ar livre, espaços seguros, alimentação equilibrada, hidratação e descanso. Em Santa Elena, ampliar o acesso ao esporte fortalece a convivência comunitária.","No Barracuda F.C., acreditamos que esporte, educação, disciplina, respeito e saúde caminham juntos. Valorizamos a preparação física, a prevenção de lesões e o bem-estar emocional acima dos resultados esportivos.","Comunidades saudáveis se constroem com prevenção, educação e oportunidades para uma vida ativa. Investir em esporte é investir em saúde, educação e futuro."],"sources":"Fontes e orientações","note":"Conteúdo informativo. A atividade deve ser adaptada à idade, às capacidades e à saúde de cada pessoa; não substitui orientação médica.","back":"Voltar à revista","share":"Compartilhar"},"fr":{"title":"Sport et santé : investir dans la vie et l'avenir de notre société","deck":"L'activité physique renforce le corps, favorise le bien-être émotionnel et contribue à des communautés plus saines.","heads":["Bien plus qu'une activité physique","Le sport, allié de la santé physique","Le sport et la santé mentale","Enfance et adolescence : des étapes essentielles","Famille, éducation et communauté","L'engagement de Barracuda F.C.","Investir dans l'avenir"],"paras":["Le sport ne se résume pas aux victoires et aux compétitions. Face à la sédentarité et aux écrans, rester actif améliore la qualité de vie. Marcher, danser, nager, faire du vélo ou jouer au football sont autant de possibilités.","Une activité régulière favorise la santé cardiovasculaire, renforce les muscles et les os et réduit le risque de maladies non transmissibles. L'OMS recommande aux adultes 150 à 300 minutes d'activité modérée par semaine, ou 75 à 150 minutes d'activité intense, ainsi qu'un renforcement musculaire au moins deux jours.","Bouger peut améliorer le sommeil, l'estime de soi et les symptômes d'anxiété et de dépression. Les sports collectifs créent des liens et un sentiment d'appartenance. Ils ne remplacent toutefois pas les soins professionnels lorsqu'ils sont nécessaires.","Chez les jeunes, l'activité favorise la motricité, la santé osseuse et le bien-être psychologique. Pour les 5–17 ans, l'OMS recommande une moyenne de 60 minutes quotidiennes d'activité modérée à intense sur la semaine. Le plaisir et la sécurité doivent primer sur les résultats.","Familles et écoles peuvent encourager le jeu en plein air, les espaces sûrs, une alimentation équilibrée, l'hydratation et le repos. À Santa Elena, un meilleur accès au sport peut renforcer la vie communautaire.","Barracuda F.C. défend une pratique associant éducation, discipline, respect et santé. Nous accordons de l'importance à la préparation physique, à la prévention des blessures et au bien-être émotionnel, avant les résultats.","Des communautés en meilleure santé se construisent grâce à la prévention, à l'éducation et à l'accès à une vie active. Investir dans le sport, c'est investir dans la santé, l'éducation et l'avenir."],"sources":"Sources et conseils","note":"Article informatif. L'activité doit être adaptée à l'âge, aux capacités et à l'état de santé; elle ne remplace pas un avis médical.","back":"Retour au magazine","share":"Partager"},"de":{"title":"Sport und Gesundheit: eine Investition in Leben und Zukunft","deck":"Bewegung stärkt den Körper, unterstützt das seelische Wohlbefinden und fördert gesündere Gemeinschaften.","heads":["Mehr als körperliche Betätigung","Sport fördert die körperliche Gesundheit","Bewegung und psychische Gesundheit","Kindheit und Jugend sind entscheidend","Familie, Bildung und Gemeinschaft","Unser Engagement bei Barracuda F.C.","In die Zukunft investieren"],"paras":["Sport bedeutet mehr als Siege und Meisterschaften. In einer von Sitzen und Bildschirmzeit geprägten Welt kann Bewegung die Lebensqualität verbessern. Spazierengehen, Tanzen, Schwimmen, Radfahren und Fußball sind mögliche Wege.","Regelmäßige Bewegung unterstützt Herz und Kreislauf, stärkt Muskeln und Knochen und senkt das Risiko nichtübertragbarer Krankheiten. Die WHO empfiehlt Erwachsenen wöchentlich 150–300 Minuten moderate oder 75–150 Minuten intensive Ausdaueraktivität sowie Muskelkräftigung an mindestens zwei Tagen.","Bewegung kann Schlaf, Selbstwertgefühl und Symptome von Angst und Depression verbessern. Mannschaftssport fördert soziale Bindungen und Zugehörigkeit. Er ersetzt jedoch keine professionelle psychische Gesundheitsversorgung, wenn diese erforderlich ist.","Bei Kindern und Jugendlichen fördert Aktivität Motorik, Knochengesundheit und psychisches Wohlbefinden. Für 5- bis 17-Jährige empfiehlt die WHO über die Woche durchschnittlich täglich 60 Minuten moderate bis intensive Bewegung. Freude und Sicherheit gehen vor Wettbewerbsergebnissen.","Familien und Schulen können Spielen im Freien, sichere Räume, ausgewogene Ernährung, ausreichendes Trinken und Erholung fördern. In Santa Elena kann breiterer Zugang zum Sport den Zusammenhalt stärken.","Barracuda F.C. verbindet Sport mit Bildung, Disziplin, Respekt und Gesundheit. Körperliche Vorbereitung, Verletzungsprävention und seelisches Wohlbefinden sind uns wichtiger als sportliche Ergebnisse.","Gesündere Gemeinschaften entstehen durch Prävention, Bildung und Möglichkeiten für einen aktiven Alltag. In Sport zu investieren heißt, in Gesundheit, Bildung und Zukunft zu investieren."],"sources":"Quellen und Hinweise","note":"Informationsartikel. Bewegung muss Alter, Fähigkeiten und Gesundheitszustand berücksichtigen und ersetzt keine medizinische Beratung.","back":"Zurück zum Magazin","share":"Teilen"},"it":{"title":"Sport e salute: un investimento nella vita e nel futuro della società","deck":"L'attività fisica rafforza il corpo, favorisce il benessere emotivo e contribuisce a comunità più sane.","heads":["Molto più di un'attività fisica","Lo sport alleato della salute fisica","Il benessere mentale migliora con lo sport","Infanzia e adolescenza: fasi fondamentali","Famiglia, educazione e comunità","L'impegno del Barracuda F.C.","Investire nel futuro"],"paras":["Lo sport va oltre vittorie e campionati. In una società segnata dalla sedentarietà e dagli schermi, muoversi migliora la qualità della vita. Camminare, ballare, nuotare, andare in bicicletta e giocare a calcio sono tutte possibilità.","L'attività fisica regolare favorisce la salute cardiovascolare, rafforza muscoli e ossa e riduce il rischio di malattie non trasmissibili. L'OMS raccomanda agli adulti 150–300 minuti settimanali di attività moderata oppure 75–150 minuti di attività intensa, oltre al rafforzamento muscolare almeno due giorni.","Il movimento può migliorare sonno, autostima e sintomi di ansia e depressione. Gli sport di squadra creano legami e appartenenza. Non sostituiscono però l'assistenza professionale quando necessaria.","Nell'infanzia e nell'adolescenza, l'attività favorisce sviluppo motorio, salute ossea e benessere psicologico. Per i 5–17 anni, l'OMS raccomanda una media di 60 minuti al giorno di attività moderata o intensa durante la settimana. Divertimento e sicurezza vengono prima dei risultati.","Famiglie e scuole possono promuovere giochi all'aperto, spazi sicuri, alimentazione equilibrata, idratazione e riposo. A Santa Elena, ampliare l'accesso allo sport può rafforzare la comunità.","Il Barracuda F.C. crede in uno sport unito a educazione, disciplina, rispetto e salute. Preparazione fisica, prevenzione degli infortuni e benessere emotivo devono prevalere sui risultati.","Comunità più sane nascono dalla prevenzione, dall'educazione e dalle opportunità di una vita attiva. Investire nello sport significa investire in salute, educazione e futuro."],"sources":"Fonti e indicazioni","note":"Articolo informativo. L'attività deve essere adeguata a età, capacità e condizioni di salute e non sostituisce il parere medico.","back":"Torna alla rivista","share":"Condividi"}};const photos=["","salud-corazon.svg","salud-bienestar.svg","salud-infancia.svg","salud-habitos.svg"];function render(lang){const d=translations[lang]||translations.es;document.documentElement.lang=lang;document.getElementById("lang").value=lang;document.getElementById("title").textContent=d.title;document.getElementById("deck").textContent=d.deck;document.getElementById("back").textContent=d.back;document.title=d.title+" | Barracuda F.C.";let h="";d.heads.forEach((head,i)=>{h+='<section class="section"><div class="copy"><h2>'+head+'</h2><p>'+d.paras[i]+'</p></div>'+(i<5?'<div class="visual"><img loading="lazy" src="assets/'+(i===0?'salud-movimiento.svg':photos[i])+'" alt="'+head.replace(/"/g,"")+'"></div>':'')+'</section>'});h+='<blockquote class="quote">“'+(lang==="es"?"Invertir en deporte es invertir en salud, educación y futuro.":d.paras[6].split(". ").slice(-1)[0])+'”</blockquote><aside class="sources"><h2>'+d.sources+'</h2><p>Organización Mundial de la Salud / World Health Organization: <a href="https://www.who.int/news-room/fact-sheets/detail/physical-activity" target="_blank" rel="noopener">Physical activity</a> · <a href="https://www.who.int/publications/i/item/9789240015128" target="_blank" rel="noopener">WHO Guidelines on physical activity and sedentary behaviour (2020)</a>.</p><p>'+d.note+'</p></aside>';document.getElementById("article").innerHTML=h;try{localStorage.setItem("barracuda-lang",lang)}catch(e){}}let initial="es";try{initial=localStorage.getItem("barracuda-lang")||"es"}catch(e){}render(translations[initial]?initial:"es");document.getElementById("lang").addEventListener("change",e=>render(e.target.value));</script></body></html>
